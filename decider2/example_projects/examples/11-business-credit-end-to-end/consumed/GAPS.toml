[[gap]]
id = "cross_facility_allocation"
component = "credit.business_origination@05 / collateral_cover"
produces = "adjusted cover for ONE facility"
needs = "an allocation ACROSS A SET of facilities with an over-allocation invariant"
why_not_there = "cross-record, which the component is not"
resolution = "COMPOSE"
owner = "11 / modules/security/allocation.py"
raised = "2026-01-19"
review = "2027-06-30"
note = """
The only gap where COMPOSE is obviously right. Project 05 has one facility by
construction; an allocation over a set is not a bigger version of cover for one,
it is a different shape (spec 5.17.2's own words: "the missing 10% is not a small
version of the 90%"). The component's advance rates and security-type derivation
are consumed unchanged INSIDE the allocation, which is what keeps this a compose
rather than a reimplementation -- see modules/security/allocation.py.
"""

