Without this, 'the construction sector PD multiplier of 1.25 expired on
2028-09-30' shows up in the cause decomposition as unexplained movement, and an
unapportionable residual is reported as a defect (spec 10 acceptance 2). So this
gap is load-bearing for an acceptance criterion, not a convenience.
"""

