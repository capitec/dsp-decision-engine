# The declared gap register. Spec 5.17.2, 10 acceptance 25, 13-Q14.
#
# Every one of the eight gaps in spec 5.17.2 appears here with a declared
# choice among EXTEND / COMPOSE / PARAMETERISE, an owner, a reason and a review
# date. FORK is not a permitted value of `resolution` -- a fork is registered in
# FORKS.toml, which is a different document with a different approval.
#
# This file is machine-read at build. Two checks:
#
#   G1  A local step writing a name that a consumed component declares as an
#       output, with no gap covering it, is a BUILD ERROR naming both. That is
#       the mechanism that makes an undeclared gap impossible: the resolution
#       "whoever hits it first, at 2am, during a batch" (spec 5.17.2) cannot be
#       reached without editing this file, and editing this file is a PR.
#
#   G2  A gap past its `review` date is a build WARNING that escalates to an
#       error after 90 days. A COMPOSE with no review date is rejected at parse.
#
# `decider reuse report` prints the counts against spec 5.17.7's thresholds:
#   gaps resolved by COMPOSE, as a share of all gaps      threshold: > 0.5
#   forks                                                 threshold: > 2

schema_version = 1
project = "11-business-credit-end-to-end"

[[gap]]
id = "grade_migration"
component = "credit.business_origination@05 / combined_grade"
produces = "a business grade"
needs = "a grade MIGRATION with a six-way cause decomposition against the predecessor"
why_not_there = "the predecessor is not an input to project 05's assessment at all"
resolution = "COMPOSE"
owner = "11 / lifecycle/annual_review/migration.py"
raised = "2026-01-19"
review = "2027-01-31"
note = """
The predecessor is a LIFECYCLE concept. Making it an input to project 05 would
give every origination an optional input it never has, and 05's contract would
grow a field that is null for its own primary use. Composing is right here and
the review date exists to test whether project 10 ends up wanting the same
thing -- two consumers is the trigger to promote.
"""

[[gap]]
id = "single_entity_rescore"
component = "credit.business_origination@05 / entity_assessment"
produces = "a full assessment of all entities"
needs = "ONE entity re-scored and ONE event classified, 9 400 times a day"
why_not_there = "published as an optimisation (05 s8, 500ms partial), not as an interface"
resolution = "EXTEND"
owner = "05 / business credit risk policy"
raised = "2026-01-19"
review = "2026-09-30"
interim = "the daily pass runs the whole-entity path; the 3-hour window holds at 2.1h against a 3h budget, p99 2.7h"
note = """
Fork pressure #1 and the largest single one in the project. Interim measurement
is the thing that keeps it a pressure rather than a fork: the budget is being
met, so the case for a stripped-down copy is a preference and not a necessity.
When the interim number crosses 2.6h mean this gap becomes a release blocker on
project 05, which is spec 5.17.7's fourth indicator working as intended.
"""

