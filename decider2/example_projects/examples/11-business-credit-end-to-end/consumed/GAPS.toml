why_not_there = "time and contingency are both absent"
resolution = "EXTEND"
owner = "credit_systems"
raised = "2026-01-19"
review = "2026-12-31"
note = """
Fork pressure #6, and the one most likely to be lost. Group exposure as at a
date, over contingent facilities, bounded by a propagation rule, in 15 minutes,
1 900 times a day. Holding a second aggregation locally would work and would be
wrong: projects 07 and 10 both want a dated aggregate and would then hold a
third. A contingent facility occupying headroom for three years and releasing it
with no decision taken (spec 5.3 O10) is a library-shaped fact.
"""

