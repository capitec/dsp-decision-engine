# The fork register. Spec 5.17.6, 10 acceptance 23.
#
#   "Zero is the target and is not expected."
#
# The previous generation's failure was not that forks happened, but that nobody
# could say how many there were or what had diverged (00 s1). So this file
# exists whether or not it has entries, it is printed at every release, and an
# entry without a remediation owner and date does not parse.
#
# It is deliberately a SEPARATE document from GAPS.toml with a separate approval
# path (Credit Systems + the forked component's owner, not this project alone).
# A fork is not a stronger gap; it is a different governance object.

schema_version = 1
project = "11-business-credit-end-to-end"
count = 0
target = 0
threshold_prompting_the_reuse_question = 2     # spec 5.17.7

# --------------------------------------------------------------------------
# The seven named pressures (spec 5.17.6). Named here, in the register itself,
# rather than in a design document -- because an unnamed pressure is one nobody
# is watching, and a pressure named only in prose is unnamed by release 40.
#
# Each carries the measurement that would tell us it had become a fork, so the
# question "did we fork?" is answered by a build, not by a memory.
# --------------------------------------------------------------------------

[[pressure]]
id = 1
where = "the daily pass's event classification"
tempting_because = "calling a whole-assessment component 9 400 times a day as singletons is slow; a stripped-down copy would be fast"
not_forking_requires = "the component publishes a single-element interface that IS the same implementation, with its singleton cost measured and acceptable"
watch = "gap single_entity_rescore; interim daily-pass mean 2.1h against a 3h budget; blocker at 2.6h"
status = "held"

[[pressure]]
id = 2
where = "the partial people re-blend"
tempting_because = "project 05 publishes a blend, not a re-blend; writing it locally is fifty lines"
not_forking_requires = "05 publishes the re-blend with its equivalence proof, or composition around the published blend is cheap enough"
watch = "gap partial_reblend"
status = "held"

[[pressure]]
id = 3
where = "covenant-scoped spreading"
tempting_because = "O7 spreads 48 lines and computes 11 measures; a DSCR covenant needs two lines and one ratio, 2.4 M times a year"
not_forking_requires = "the spreading component can be invoked for a DECLARED SUBSET without a second mapping table appearing"
watch = "consumed/p05_origination.py CovenantScopedSpread; a second mapping table anywhere under tables/ is a CI failure"
status = "held"

[[pressure]]
id = 4
where = "project 02 for the sole proprietor"
tempting_because = "the regulated assessment is heavy, the fifth mode does not exist, and a local approximation would pass most cases"
not_forking_requires = "the fifth mode is added by project 02 on project 02's cadence -- and this project can wait for it"
watch = "gap affordability_mode_5; 90 referrals/month is the pressure that funds the mode"
status = "held -- the highest-risk of the seven, because the approximation would work"

[[pressure]]
id = 5
where = "the seven new facility types' pricing"
tempting_because = "project 05's search is built around two products; six new candidate spaces is a large change to somebody else's component"
not_forking_requires = "the search is genuinely parameterised by its candidate space (05 13-Q10)"
watch = "consumed/p05_origination.py PricingSearch; tables/facility_types.toml carries all nine spaces as data"
status = "held -- and this was the test of 05 13-Q10. It passed."

[[pressure]]
id = 6
where = "core.exposure for the cascade"
tempting_because = "group exposure as at a date, over contingent facilities, bounded by a propagation rule, in 15 minutes, 1 900 times a day"
not_forking_requires = "the library capability takes a date and an exposure-conversion convention, rather than this project holding a second aggregation"
watch = "gap exposure_as_at_date; a second aggregation under modules/ is a CI failure"
status = "held, awkwardly -- the cascade currently runs the published aggregate twice and differences it, which is slower than it should be"

[[pressure]]
id = 7
where = "the library's null handling for role-inapplicable values"
tempting_because = "adding a fourth null situation to core touches six consumers; a local convention touches none"
not_forking_requires = "the library adds it, or the three existing situations are shown to be sufficient and the fourth is a modelling error here"
watch = "roles.py NOT_APPLICABLE is currently a PROJECT-LOCAL construct. That is the closest thing to a fork in this project and it is recorded as such."
status = "AT RISK -- see FRAMEWORK-DEMANDS D9. 11 change scenario 18 is this."
