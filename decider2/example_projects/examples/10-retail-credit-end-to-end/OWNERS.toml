# ---------------------------------------------------------------------------
# Cross-ownership that must be VISIBLE rather than discovered.
#
# Spec 5.26.4: "T12 owns the phase and owns almost nothing the phase depends
# on."  The blast-radius router reads this table, so a T6 rate-card change
# notifies T12 automatically -- T6 cannot be expected to know that a card cell
# participates in a consolidation objective.
# ---------------------------------------------------------------------------

[[depends_on]]
owner = "T12"
phase = "P14"
reads_artefacts_owned_by = ["T6", "T4", "T3"]
notify_on_change = true
note = "P14 owns 63 decision points and none of the five artefact families it reads."

[[depends_on]]
owner = "T7"
phase = "P13"
reads_artefacts_owned_by = ["T6", "T4", "T3"]
notify_on_change = true
note = "The solve's correctness bound (19 evaluations/term) is a function of card shape."

[[depends_on]]
owner = "T11"
phase = "P16"
reads_artefacts_owned_by = ["T2"]
notify_on_change = true
note = "23 campaign tree nodes key off feature bands T2 edits on a Tuesday. Spec 5.28."

# ---------------------------------------------------------------------------
# Shared values with a delegated dimension.  Spec 5.26.3: T4 owns the
# affordability buffer; T8 wants it to vary by channel for entry point 2.  The
# flow widened the key to grade x product x channel and DELEGATED the channel
# dimension to T8 within declared bounds.  Widening a key widens an ownership
# boundary, so the delegation is declared here and nowhere else.
# ---------------------------------------------------------------------------

[[delegation]]
artefact = "buffer_grid"
owner = "T4"
delegated_dimension = "channel_class"
delegated_to = "T8"
bounds = { min = 0.06, max = 0.24 }
approval = "CC-2027-05"
review_date = "2028-03-31"
note = "T8 may move any cell within bounds along the channel axis only. T8 cannot add a dimension."
