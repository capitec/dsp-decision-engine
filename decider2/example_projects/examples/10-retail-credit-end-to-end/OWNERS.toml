# ============================================================================
# The ownership map.  ONE declaration, for the whole project.
#
# Spec 5.26.1 gives twelve teams, 18 phases of which thirteen have two or more
# owners and one has five, 47 tables, 340 parameters and 1 400 decision points
# of which "every decision point has exactly one owner, so the last column sums
# exactly".
#
# ----------------------------------------------------------------------------
# WHY OWNERSHIP IS NOT IN THE DIRECTORY TREE
# ----------------------------------------------------------------------------
# The obvious layout is phases/p09_policy_gates/t4_credit_risk_policy/... .  It
# is wrong, and spec 11 scenarios 4 and 5 are why:
#
#   scenario 4  T4 splits into Retail Policy and Portfolio Policy.  89 decision
#               points, 13 tables and 88 parameters divide unevenly.
#   scenario 5  T7 and T8 merge.
#
# If ownership is a path segment, both are repository-wide file moves: every
# import breaks, every `decision_point_id` that is path-derived changes, every
# archived reviewable rendering stops resolving, and N3 ("zero unresolvable
# citations") fails for every decision made before the move.  A re-org would
# be indistinguishable, in the record, from a logic change.
#
# So ownership is DATA.  It is declared here, carried as `owner=` on every
# decision point, table and parameter, and checked three ways at build:
#
#   1. every decision point names a team that exists here;
#   2. the per-team decision-point counts below are ASSERTIONS -- they must
#      equal what the registry finds, and they must sum to 1 400;
#   3. `.github/CODEOWNERS` is GENERATED from this file plus the registry, so
#      review routing follows ownership automatically and cannot drift.
#
# Answer to spec 11.4 and 11.5: a team split or merge is a diff to THIS FILE
# and to the `owner=` token on the affected decision points.  No logic moves,
# no path changes, no id changes.  A merge is purely a re-attribution.
#
# ----------------------------------------------------------------------------
# The directory tree is organised by PHASE, because the phase is the unit of
# ordering, budget, degradation policy, blast radius and record citation.
# Ownership crosses it thirteen times out of eighteen; subject does not.
# ============================================================================

[project]
name          = "retail_credit"
decision_points = 1400        # asserted against the registry at build
phases          = 18
tables          = 47
parameters      = 340
entry_points    = 8

# ---------------------------------------------------------------------------
# The twelve teams.  `param_classes` is the list of parameter classes this team
# may author a document for (params/classes.py); a document carrying a key from
# a class not listed here is REJECTED, not ignored.  That is how spec 10
# criterion 4 -- "a statutory value is unreachable from a product team's change
# surface, demonstrated by attempt, not by convention" -- is demonstrable.
# ---------------------------------------------------------------------------

