# The internal latency budget, entry point 1. Spec 5.24.1. DECLARED, not
# commented: `phase.budget = budget_ref("P01")` (phases/__init__.py) resolves
# to a row in THIS file, so a phase's budget is a value the overrun policy
# (budgets/overrun.py) reads, not a number that lives only in a spec's prose.
#
# 111.5 ms serial total against a 120.0 ms target: 8.5 ms slack, 7.1%. Every
# row below is measured per decision, not averaged across a day — a phase
# exceeding its own row on more than 0.5% of requests in a day is a defect
# with a named owner (`owner=`), and the count lands in
# `phase_budget_overrun_codes` on every affected record.
#
# P14 and P15 have no row here: P14 leaves this budget class entirely when it
# fires (budgets/ep01_loop.toml is its own artefact, not a bigger slice of
# this one) and P15 does not run on entry point 1 at all.

[meta]
entry_point = 1
target_p99_ms = 120.0
serial_total_ms = 111.5
slack_ms = 8.5
slack_pct = 7.1
measured_per_decision = true
overrun_threshold_pct = 0.5
overrun_policy = "budgets/overrun.py"

[[phase]]
id = "P01"
owner = "T1"
budget_ms = 1.5
note = "No external dependency by design."

[[phase]]
id = "P02"
owner = "T2"
budget_ms = 2.5
note = "Excludes the identity service call, which is external."

[[phase]]
id = "P03"
owner = "T3"
budget_ms = 2.5
note = "62 decision points, all evaluated. evaluate_all=True costs the same whether the client passes or fails."

[[phase]]
id = "P04"
owner = "T1"
budget_ms = 3.0
note = "Dispatch and collation only. Waiting is excluded -- see budgets/ep01.toml's external budget."

[[phase]]
id = "P05"
owner = "T10"
budget_ms = 5.5
abandonable_component = "shadow_rules"
note = "219 rule evaluations, no early exit."

[[phase]]
id = "P06"
owner = "T2"
budget_ms = 13.0
note = "Second-largest allocation. ~510 derived values."

[[phase]]
id = "P07"
owner = "T5"
budget_ms = 5.0
abandonable_component = "challenger_scorecard"
note = "Up to two scorecards, up to 125 characteristic contributions."

[[phase]]
id = "P08"
owner = "T5"
budget_ms = 3.0
note = "Includes overlay register resolution (O-05: resolved once, here)."

[[phase]]
id = "P09"
owner = "T4"
budget_ms = 7.5
note = "Up to three products x 47 applicable entries."

[[phase]]
id = "P10"
owner = "T4"
budget_ms = 8.5
note = "Two passes: product-neutral (O-09) and routed."

[[phase]]
id = "P11"
owner = "T7"
budget_ms = 2.0

[[phase]]
id = "P12"
owner = "T6"
budget_ms = 2.5
note = "Outside the solve; P12 is also called AS A BODY inside P13's 38.0 ms below."

[[phase]]
id = "P13"
owner = "T1"
budget_ms = 38.0
not_abandonable = true
note = "Largest single allocation. 19 evaluations/term is a correctness parameter, not available to be cut."

[[phase]]
id = "P16"
owner = "T7"
budget_ms = 6.5
abandonable_component = "second_and_third_product_fanout"

[[phase]]
id = "P17"
owner = "T1"
budget_ms = 8.0
not_abandonable = true
note = "Full independent re-derivation."

[[phase]]
id = "P18"
owner = "T3"
budget_ms = 2.5
not_abandonable = true
note = "Synchronous portion only; the record write is asynchronous (O-21)."
