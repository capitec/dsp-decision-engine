# ===========================================================================
# ENTRY POINT 7 -- QUOTATION ONLY, NO DECISION
#
# "The sharpest structural case in the document." (spec 4.1)
#
# Everything under [derived] is an ASSERTION, not a definition.  The build
# derives the phase set from applicability (entrypoints/manifest.py) and
# compares.  If a phase gains an input that makes it applicable here, or loses
# one that makes it inapplicable, THIS FILE FAILS THE BUILD and names the
# phase.  That is the mechanism that stops entry point 7 silently becoming
# entry point 1 with things switched off.
# ===========================================================================

[entry_point]
code   = 7
name   = "quotation"
mode   = "realtime"
volume = "22 000/day"
owner  = "T1"

[contract]
# A quotation is a REPRESENTATION, not a decision.  These three are structural.
emits_outcome_code      = false
emits_decision_record   = false
emits_quotation_record  = true
assesses_client         = false
touches_bureau          = false
external_calls          = 0
# Spec 4.1: "a quotation that understates the initiation fee is a refundable
# overcharge across every agreement written from it."  So the fee arithmetic
# here is not an approximation of entry point 1's -- it IS entry point 1's, the
# same step object, and P17 assertions 1-6 run to prove it.
fee_arithmetic_shared_with = [1, 2, 5, 6]

[budget]
target_p99_ms = 50.0
file          = "budgets/ep07.toml"
# Spec 4.1: "sub-50 ms with no external calls means the whole seven-phase
# traversal has less budget than entry point 1 gives to the solve alone."
# Three things entry point 1 does that this variant must not carry, and each is
# absent BY CONSTRUCTION because the specialisation does not link them:
absent_by_construction = [
  "lazy_rate_card_resolution",   # 34 560 cells are resident and indexed; see [tables]
  "full_decision_record",        # a different record shape, not a filtered one
  "per_request_overlay_stack",   # resolved at generation activation, not per request
]

[tables]
# The rate card is not resolved per request here.  A generation carries the
# resolved, indexed card and the specialisation holds a direct index, so the
# lookup is an array read.  Doc 02 8 "cold start": 135 204 cells resident and
# indexed before the first request, not on it.
resident      = ["rate_card_flex", "rate_card_revolving", "statutory_fee_caps",
                 "credit_life_rates", "long_term_loading", "statutory_ceiling"]
lazy          = []

# ---------------------------------------------------------------------------
# DERIVED -- assertions.  Seven of eighteen.
# ---------------------------------------------------------------------------

[derived]
phase_set_id            = 7
expected_phases         = ["P01", "P03", "P09", "P11", "P12", "P17", "P18"]
expected_phase_count    = 7
# 41 + 9 + 12 + 34 + 83 + 6 + 12 = 197 evaluated, of which 173 are citable:
# the 24 structural-validation checks in P01 cannot be cited as a reason for an
# outcome because a malformed request is not a credit decision (spec 5.2).  The
# build does this arithmetic; the number below is what it must reach.
expected_decision_points = 173

[derived.reduced]
# Each entry states WHY the reduction happened.  `cause = "derivation"` means
# nobody declared it -- the inputs simply are not there.  `cause = "declared"`
# means a human decided, and then `declared_in` points at the one place a human
# may decide it.
P03 = { expected = 9,  of = 62,  cause = "derivation", missing_inputs = ["client_id", "consent_state", "applicant_age_years"] }
P09 = { expected = 12, of = 196, cause = "declared",   declared_in = "manifest.py:DECLARED_APPLICABILITY[1]", approved = "COMP-2027-11" }
P11 = { expected = 34, of = 52,  cause = "derivation", missing_inputs = ["risk_grade", "income_source_code", "security_value"] }
P17 = { expected = 6,  of = 61,  cause = "derivation", missing_inputs = ["max_affordable_instalment", "amount_cap", "risk_grade"] }
P18 = { expected = 12, of = 39,  cause = "derivation", missing_inputs = ["decline_reason_codes", "score_contributions"] }

[derived.assertions_p17]
# Spec 4.1 says this document "does not choose" between one phase with declared
# applicability per assertion and two phases that will diverge within a year.
# Derivation makes the choice unnecessary: assertion 7 reads
# `max_affordable_instalment`; P10 did not run; therefore assertion 7 is
# inapplicable.  Nobody wrote a list.  The list below is the CHECK.
product_10_expected = [1, 2, 3, 4, 5, 6]
product_10_count    = 6
product_20_count    = 5
# A new assertion that accidentally becomes applicable here fails this count.

[record]
shape          = "QuotationRecord"
mean_bytes     = 1100
annual_volume  = 8_000_000
completeness   = 2          # `record_completeness_code` 2 -- phase-absent-by-entry-point
# Spec 4.5's fourth null.  Every phase in [absent] is absent for a STRUCTURAL
# reason and the record says so; it is not a null, not a zero, not a failure.
absent         = ["P02","P04","P05","P06","P07","P08","P10","P13","P14","P15","P16"]

[disclosure]
# Spec 7.1 entry point 7.  Five components that must SUM to the total; the sum
# is P17 assertion 6's job and it runs here.
components = ["capital", "interest", "initiation_fee", "service_fees", "premiums"]
must_sum_to = "total_cost_of_credit"
amount_financed_stated_separately = true    # a different number from the advance
credit_life_substitution_right_stated = true
