# The cap register interior document. 118 entries in the real artefact;
# eleven representative ones here (spec 5.10's own worked table, plus two
# more cited elsewhere in this repo). Read and enforced by
# phases/p09_policy_gates/register.py's `CapRegister` ruleset — this file is
# the INTERIOR, that file is the INTERFACE (doc 08 §3's split).
#
# Every entry declares `narrows` (which values/ceilings.py object it targets)
# and nothing else about direction: the ceiling's own `direction=` is what
# gets checked, so an entry here cannot silently acquire a raise permission
# by being written wrong. `sequence` is load-bearing (O-12 pins CAP-0118
# last; worst_acceptable_grade's `order_is_load_bearing=True` note in
# values/ceilings.py is about entries like CAP-0176 below).

