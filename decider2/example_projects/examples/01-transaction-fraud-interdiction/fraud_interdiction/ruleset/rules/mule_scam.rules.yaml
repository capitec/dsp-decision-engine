# Mule and scam family — 96 live rules. Six shown.
#
# WHO EDITS THIS: fraud analysts, through the rule editor, never by hand. The
# YAML is the wire format and the review format; the editor is the authoring
# format. It is checked in because a rule set that only exists in a database is
# not diffable and cannot be reviewed in a pull request.
#
# THE ONE THING TO UNDERSTAND ABOUT THIS FILE:
#   `evaluate`, `applies_to.event_types` and `on_absent` are SHAPE.
#   Changing them recompiles one block of ~33 rules and takes ~2 seconds.
#   `shape_version` increments.
#
#   Everything else is VALUES. `tunables.*.default` is only a default —
#   the deployed number lives in config/interdict/production.params.json with
#   its own approval and its own effective-from. Changing it recompiles
#   nothing: it is a bundle swap, microseconds, and that is the 85% path.
#   `version` increments; `shape_version` does not.
#
# The two counters are the answer to spec Q4 — "where does tuning a threshold
# end and changing a rule's shape begin, and is that distinction visible in the
# artefact or only in a review process?" It is visible: it is two integers on
# every rule, and the approval routing keys on which one moved.

ruleset: live_rules
family: MS
family_owner: { team: fraud-strategy, individual: n.dlamini }
document_version: 412
schema: decider2/ruleset/v1

rules:

  - id: MS-0208
    version: 7
    shape_version: 2
    status: live
    title: First payment to a very new beneficiary at a high-mule-rate bank
    describe:
      internal: >
        First payment to a beneficiary added less than two hours ago, above
        R8 000, where the receiving bank is in the top mule-rate band and the
        client changed device within 72 hours. The four together are the
        authorised-push-payment scam signature after a remote-access takeover.
      client_safe_reason: 4412        # into core.reason_codes — never free text
    owner: { team: fraud-strategy, individual: n.dlamini }
    effective: { from: 2026-03-01T00:00:00Z, to: null }
    applies_to:
      event_types: [210, 211, 313]
      segments: { all_except: [business_linked] }
    evaluate:
      all:
        - { feature: beneficiary_age_hours,        op: lt, value: { tunable: max_beneficiary_age_h } }
        - { feature: amount_zar_cents,             op: gt, value: { tunable: min_amount } }
        - { feature: beneficiary_bank_mule_band,   op: ge, value: { tunable: min_bank_band } }
        - { feature: hours_since_any_device_change, op: lt, value: { tunable: max_device_change_h } }
    tunables:
      max_beneficiary_age_h:  { default: 2,      unit: hours,            bounds: [0.5, 72] }
      min_amount:             { default: 800000, unit: amount_zar_cents, bounds: [100000, 50000000] }
      min_bank_band:          { default: 4,      unit: band,             bounds: [1, 5] }
      max_device_change_h:    { default: 72,     unit: hours,            bounds: [1, 720] }
    on_absent:
      beneficiary_age_hours: suppress            # unevaluable, recorded as such
      amount_zar_cents: suppress
      beneficiary_bank_mule_band: last_good
      hours_since_any_device_change: evaluate_false
    outcome:
      action: hold_for_review
      severity: 4
      priority: 220
      queue: SCAM-1
      sla_tier: T15
    flags: { critical: false, overlay_exempt: false, suppressible: true }
    limits: { max_fire_rate_pct: 0.40 }
    approval:
      author: n.dlamini
      approver: t.mokoena
      approved_at: 2026-02-27T11:04:31Z
      backtest_ref: BT-2026-0227-14
      shape_change: true

  - id: MS-0311
    version: 3
    shape_version: 3
    status: live
    title: Beneficiary concentration spike on a same-session device
    describe:
      internal: >
        More than 60% of the client's 24-hour outflow going to one beneficiary,
        where the device and the beneficiary appeared within four hours of each
        other. Catches the payout leg of a takeover that the first-payment rules
        miss because the fraudster made a small test payment first.
      client_safe_reason: 4412
    owner: { team: fraud-strategy, individual: n.dlamini }
    effective: { from: 2026-05-14T00:00:00Z, to: null }
    applies_to:
      event_types: [210, 211]
      segments: all
    evaluate:
      all:
        - { feature: "feat:beneficiary_concentration_24h", op: gt, value: { tunable: min_concentration } }
        - { feature: "feat:device_age_vs_beneficiary_age", op: between,
            value: { tunable: window_lo }, value_hi: { tunable: window_hi } }
        - any:
            - { feature: cop_name_match_band, op: is_in, values: [2, 3] }   # close / no-match
            - { feature: beneficiary_bank_mule_band, op: ge, value: { tunable: min_bank_band } }
    tunables:
      min_concentration: { default: 0.60, unit: ratio, bounds: [0.2, 1.0] }
      window_lo:         { default: -4.0, unit: hours, bounds: [-72, 0] }
      window_hi:         { default: 4.0,  unit: hours, bounds: [0, 72] }
      min_bank_band:     { default: 4,    unit: band,  bounds: [1, 5] }
    on_absent:
      "feat:beneficiary_concentration_24h": suppress
      "feat:device_age_vs_beneficiary_age": suppress
      cop_name_match_band: evaluate_false
      beneficiary_bank_mule_band: last_good
    outcome: { action: step_up, severity: 3, priority: 310, challenge: in_app_push }
    flags: { critical: false, overlay_exempt: false, suppressible: true }
    limits: { max_fire_rate_pct: 1.20 }
    approval:
      author: n.dlamini
      approver: r.pillay
      approved_at: 2026-05-13T16:22:08Z
      backtest_ref: BT-2026-0513-02
      shape_change: true

  - id: MS-0117
    version: 14
    shape_version: 4
    status: retired
    title: Instant payment to a first-time beneficiary above the segment floor
    describe:
      internal: >
        Superseded by MS-0208 and MS-0311, which together caught 98.6% of its
        firings at 3.1x the precision. Retired with evidence; see the dead-rule
        report of 2026-06-18.
      client_safe_reason: 4412
    owner: { team: fraud-strategy, individual: n.dlamini }
    # Retirement is an effective_to, and nothing else. It takes effect at the
    # instant, on every event thereafter, with no compile — and it is provable
    # by the per-minute firing aggregate going to zero at exactly 23:59:59Z on
    # 30 June, which is spec §9.3's retirement evidence without scanning 140 M
    # records. The rule stays in the live kernel, date-gated, until the next
    # housekeeping generation drops it; replay before that instant still works
    # because the generation is pinned.
    effective: { from: 2024-08-01T00:00:00Z, to: 2026-06-30T23:59:59Z }
    applies_to: { event_types: [210], segments: all }
    evaluate:
      all:
        - { feature: beneficiary_first_payment, op: is_true }
        - { feature: amount_zar_cents, op: gt, value: { tunable: min_amount } }
    tunables:
      min_amount: { default: 500000, unit: amount_zar_cents, bounds: [100000, 50000000] }
    on_absent: { beneficiary_first_payment: suppress, amount_zar_cents: suppress }
    outcome: { action: hold_for_review, severity: 3, priority: 400, queue: SCAM-2, sla_tier: T60 }
    flags: { critical: false, overlay_exempt: false, suppressible: true }
    limits: { max_fire_rate_pct: 2.00 }
    approval:
      author: n.dlamini
      approver: h.abrahams
      approved_at: 2026-06-18T09:12:00Z
      backtest_ref: BT-2026-0617-08
      shape_change: false
      retirement_evidence: DR-2026-0618-MS

  - id: MS-0402
    version: 2
    shape_version: 1
    status: live
    title: Confirmed mule beneficiary — mandatory decline and report
    describe:
      internal: >
        The beneficiary is on the confirmed-mule watchlist as at the event
        instant. Declines and starts the reporting clock. This rule exists in
        addition to the hard block in 5.7 so that the mule family's own catch
        statistics include it, and so that an analyst tuning the family next
        quarter can see it.
      client_safe_reason: 4401
    owner: { team: financial-crime-compliance, individual: p.naidoo }
    effective: { from: 2025-01-01T00:00:00Z, to: null }
    applies_to: { event_types: [210, 211, 220, 313], segments: all }
    evaluate:
      all:
        - { feature: mule_list_membership, op: is_member }
    tunables: {}
    on_absent:
      # Fail closed. An unreachable watchlist does not mean "not a member";
      # 5.6 puts the event into fail-closed mode and this rule suppresses so
      # that the *mode*, not this rule, decides — visibly.
      mule_list_membership: suppress
    outcome: { action: decline, severity: 5, priority: 10 }
    flags:
      critical: true                 # binding — taken even if a milder action would win
      overlay_exempt: true           # no dial may loosen a regulatory control
      suppressible: false
    limits: { max_fire_rate_pct: 0.05 }
    obligations: [suspicious_activity_report]
    approval:
      author: p.naidoo
      approvers: [h.abrahams, c.vandermerwe]     # two named — critical rules are not four-eyes
      approved_at: 2024-12-19T14:31:02Z
      backtest_ref: BT-2024-1218-01
      shape_change: true

  - id: MS-0455
    version: 1
    shape_version: 1
    status: live
    title: Pre-notified corporate bulk payment run — allow
    describe:
      internal: >
        A corporate client's bulk payment run, pre-notified and within its
        declared window and value envelope. Velocity rules would otherwise stop
        every payment after the fourth. Critical-allow: suppresses the CF and MS
        families for this event only, and nothing else.
      client_safe_reason: 0
    owner: { team: fraud-strategy, individual: r.pillay }
    effective: { from: 2026-01-15T00:00:00Z, to: null }
    applies_to:
      event_types: [210, 211]
      segments: { any_of: [business_linked] }
    evaluate:
      all:
        - { feature: bulk_run_prenotified, op: is_true }
        - { feature: bulk_run_value_within_envelope, op: is_true }
    tunables: {}
    on_absent:
      bulk_run_prenotified: evaluate_false          # absent notification = not notified
      bulk_run_value_within_envelope: evaluate_false
    outcome: { action: allow, severity: 1, priority: 5 }
    flags:
      critical: true
      critical_allow_families: [CF, MS]     # exactly which families it silences
      overlay_exempt: true
      suppressible: false
    limits: { max_fire_rate_pct: 8.00 }
    approval:
      author: r.pillay
      approvers: [h.abrahams, t.mokoena]
      approved_at: 2026-01-14T10:02:44Z
      backtest_ref: BT-2026-0113-05
      shape_change: true

  - id: MS-0498
    version: 1
    shape_version: 1
    status: live
    title: Compensating — new beneficiary payment with no model score
    describe:
      internal: >
        Activated only in restricted and fail-closed mode. References no model
        score and no velocity aggregate, so it survives the two outages that
        take the rest of the family down. Deliberately blunter than MS-0208 and
        deliberately more expensive in false positives; it exists to keep a
        floor under catch rate during a serving incident, not to be precise.
      client_safe_reason: 4412
    owner: { team: fraud-strategy, individual: n.dlamini }
    effective: { from: 2026-04-02T00:00:00Z, to: null }
    applies_to:
      event_types: [210, 313]
      segments: all
      activated_in_modes: [restricted, fail_closed]   # never applicable in normal
    evaluate:
      all:
        - { feature: beneficiary_added_within_60min, op: is_true }
        - { feature: amount_zar_cents, op: gt, value: { tunable: min_amount } }
    tunables:
      min_amount: { default: 300000, unit: amount_zar_cents, bounds: [50000, 50000000] }
    on_absent:
      beneficiary_added_within_60min: evaluate_false
      amount_zar_cents: suppress
    outcome: { action: hold_for_review, severity: 3, priority: 500, queue: SCAM-2, sla_tier: T60 }
    flags: { critical: false, overlay_exempt: false, suppressible: true }
    limits: { max_fire_rate_pct: 6.00 }
    approval:
      author: n.dlamini
      approver: h.abrahams
      approved_at: 2026-04-01T08:55:13Z
      backtest_ref: BT-2026-0331-09
      shape_change: true
