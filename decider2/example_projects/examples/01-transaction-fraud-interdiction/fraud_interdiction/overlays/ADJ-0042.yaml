# One overlay, complete. This is the artefact the duty officer creates at 19:41
# on a Friday and that is live 94 seconds later.
#
# Everything in this file is a VALUE: no rule is edited, no kernel is
# recompiled, and the base rule set stays byte-identical to what was approved.
# That is not a convenience, it is spec §6.5.1 and core §7.6 — a model
# validator and a regulator must see the authored rule and the policy overlay
# separately, and merging one into the other is prohibited.

adjustment_id: ADJ-0042
kind: sensitivity_dial
title: Card-testing attack — acquirer 51042, card-not-present
schema: decider2/adjustment/v1

rationale: >
  From 19:22 a card-testing pattern against acquirer 51042 is running at
  ~400 attempts a minute, concentrated on card-not-present authorisations with
  acquirer country 566. The card-fraud family's amount and count thresholds are
  tuned for genuine retail and are above the attack's amounts. Running CF at
  1.4x sensitivity on this scope for 72 hours buys interdiction now without
  writing rules under time pressure. Expected additional holds ~180/hour
  against CARD-1 capacity of 1 100/hour (backtest BT-2026-1128-02, run over the
  preceding 14 days restricted to the attack scope).

  Written for someone who was not in the room: the alternative considered and
  rejected was a new rule, which would have taken 4 minutes rather than 2 and
  would have needed retirement afterwards rather than expiring on its own.

owner: { team: fraud-strategy, individual: h.abrahams }
approval:
  author: duty.officer.4                 # the 24/7 out-of-hours authority
  approvers: [h.abrahams, t.mokoena]     # two named people, not a role
  approved_at: 2026-11-28T19:41:12Z
  backtest_ref: BT-2026-1128-02

effective:
  from: 2026-11-28T19:41:30Z
  to:   2026-12-01T19:41:30Z             # 72h. Max initial duration is 90 days.
review_date: 2026-11-29T09:00:00Z        # required, and <= effective_to
renewal:
  count: 0
  # A renewal is a fresh approval requiring a fresh backtest of the overlay's
  # CURRENT effect. Not a re-signature. Three renewals escalates for conversion
  # into a rule change.

scope:
  families: [CF]
  rule_ids: null                         # whole family
  event_types: [111]
  channels: [ecommerce]
  acquirer_countries: [566]
  segments: any
  exclude_overlay_exempt: true           # always true; present so it is visible

effect:
  multiply:
    units: [amount_zar_cents, count]     # NOT band or ratio — a dial must not
                                         # move a band cut-off, which would
                                         # silently reinterpret a table
    factor: 0.714286                     # 1 / 1.4, expressed as the threshold
                                         # multiplier it actually is
compose_at: 30                           # explicit position; unique in the stack

measured_effect:                         # written back by the monitor, hourly
  as_of: 2026-11-29T08:00:00Z
  events_in_scope: 214_882
  additional_firings: 2_411
  additional_holds: 1_902
  confirmed_fraud_caught_incremental: 61
  value_blocked_zar_cents: 4_118_220_000
  action_churn: { to_more_severe: 1902, to_less_severe: 0 }
