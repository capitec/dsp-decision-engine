# The standing overlay register — every overlay in force, its age, its measured
# effect and its days to expiry. Spec §6.5.5.
#
# THIS FILE IS THE CONTROL. The approval asymmetry — an overlay is live in 2
# minutes on the duty officer's authority, a rule change takes 10 and four-eyes
# from the family owner — is exactly why the faster path accumulates
# unexplained residue. The register makes the residue visible and the expiry
# makes it disappear on its own. An overlay reaching effective_to lapses within
# one assessment, and the lapse is outcome-affecting and recorded on every event
# after it.
#
# Composition order is `compose_at`, declared and unique. It is never insertion
# order and never load order: "composition order changes the answer and is part
# of the definition, not emergent" (spec §6.5.3).

