# Queue and SLA matrix — 11 queues x 4 tiers. Owned by Fraud Ops, changed
# weekly. This is a VALUE document: a capacity change is a bundle swap.
#
# Why overflow policy is here and not in a rule: Fraud Operations is fixed
# capacity. "A change that increases holds by 30% does not produce 30% more
# reviews, it produces a queue that breaches its service level and a manual
# instruction to release everything above a certain age unexamined." The
# overflow policy is that instruction, written down in advance and recorded on
# every event it touched, instead of shouted across the floor at 02:00.

version: 44
effective_from: 2026-09-14T00:00:00Z
owner: { team: fraud-operations, individual: m.jacobs }
approval: { author: m.jacobs, approver: h.abrahams, approved_at: 2026-09-13T15:00:00Z }

sla_tiers:
  T15:  { minutes: 15,   description: "Client is standing at a till." }
  T60:  { minutes: 60 }
  T240: { minutes: 240 }
  TNBD: { next_business_day: true }

queues:
  - { code: SCAM-1, family: MS, min_severity: 4, tier: T15,  capacity_per_hour: 420,
      depth_threshold: 300, overflow: { policy: reroute, to: SCAM-2, record: true } }
  - { code: SCAM-2, family: MS, min_severity: 2, tier: T60,  capacity_per_hour: 900,
      depth_threshold: 1200, overflow: { policy: demote_tier, to: T240, record: true } }
  - { code: CARD-1, family: CF, min_severity: 4, tier: T15,  capacity_per_hour: 1100,
      depth_threshold: 800, overflow: { policy: reroute, to: CARD-2, record: true } }
  - { code: CARD-2, family: CF, min_severity: 2, tier: T240, capacity_per_hour: 2400,
      depth_threshold: 3000, overflow: { policy: auto_release_above_age,
                                         age_minutes: 360, record: true,
                                         requires: duty_officer_standing_authority } }
  - { code: ATO-1,  family: AT, min_severity: 3, tier: T15,  capacity_per_hour: 600,
      depth_threshold: 450, overflow: { policy: reroute, to: ATO-2, record: true } }
  - { code: ATO-2,  family: AT, min_severity: 1, tier: T60,  capacity_per_hour: 1500,
      depth_threshold: 2000, overflow: { policy: demote_tier, to: TNBD, record: true } }
  - { code: AML-1,  family: AA, min_severity: 1, tier: T240, capacity_per_hour: 300,
      depth_threshold: 500,
      # AML-adjacent holds may never be auto-released: the statutory clock has
      # already started and releasing unexamined would be a reporting failure,
      # not a service-level one.
      overflow: { policy: page_owner, record: true } }
  - { code: FPF-1,  family: FP, min_severity: 2, tier: TNBD, capacity_per_hour: 200,
      depth_threshold: 800, overflow: { policy: demote_tier, to: TNBD, record: true } }
