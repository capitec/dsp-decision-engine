# The artefact register for the credit limit programme.
#
# This file is what `artefacts.resolve(decision_date=..., selector=...)` reads.
# It is the single place where "which version was in force on 2026-09-01" is
# answered, for every table in the project, and it is why a 2026 cycle is
# re-derivable in 2031 (s10.13).
#
# Three things are declared per version and none of them is optional:
#   effective_from / effective_to   - resolution is by decision_date, never "today"
#   state                           - candidate | live | superseded
#   approval                        - the committee reference that made it live
#
# A `candidate` version is neither live nor absent (s13.4). It can be loaded,
# validated, diffed, simulated over the full book and presented, and it becomes
# live on a date by an edit to this file -- not by a deployment.

manifest_version: 4
owner: credit-risk-policy@bank.example

artefacts:

  clm.limit_matrix:
    schema: limit_matrix/schema.json
    authored_in: spreadsheet
    owner: Credit Risk Policy
    approval_required: Credit Committee
    cadence: quarterly
    key_domain_versioned: true      # scenario 5: 8 utilisation bands becomes 9,
                                    # and the 8-band cell ids stay resolvable
    versions:
      - version: 2026Q2
        source: limit_matrix/2026Q2.csv
        effective_from: 2026-04-01
        effective_to: 2026-06-30
        state: superseded
        approval: CC-2026-0114
        content_hash: sha256:9f2c41ab8e7d5306c1b4f0a9e2d7c85b3a6f1e9047cd28b5f3a7e6d1c0b94825
        simulation: SIM-2026-0304-02
      - version: 2026Q3
        source: limit_matrix/2026Q3.csv
        effective_from: 2026-07-01
        effective_to: 2026-09-30
        state: live
        approval: CC-2026-0417
        content_hash: sha256:3b7e9d1c5a0f826473e8d2b9c14a6f05d83e7c1b9a4f2086e5d37c9b1a0e84d62
        simulation: SIM-2026-0602-05
        validation:
          dense: pass
          bounds: pass
          MTX-W01: 11 warnings accepted
          accepted_by: h.mokoena
          accepted_on: 2026-06-18
      - version: 2026Q4-candidate-c
        source: limit_matrix/2026Q4_candidate_c.csv
        state: candidate
        author: r.naidoo
        created: 2026-09-11
        cells_changed: 340
        simulation: SIM-2026-0913-07
        # No effective_from. A candidate has no dates until Credit Committee
        # approves it, which is an edit to this file and nothing else.

  clm.overlay_register:
    schema: overlay_register.schema.json
    source: overlay_register.json
    owner: Credit Risk Policy, ALCO
    cadence: ad hoc, sometimes mid-cycle
    kind: generic_kernel          # doc 08 s3.4 -- contents change without a compile
    lapse_policy: halt            # a lapsed overlay STOPS THE CYCLE (s10.6)
    review_warning_days: 30

  clm.decrease_thresholds:
    schema: decrease_triggers.schema.json
    owner: Credit Risk Policy + Collections
    cadence: quarterly
    versions:
      - version: 2026H2
        source: decrease_triggers.csv
        effective_from: 2026-07-01
        state: live
        approval: CRPC-2026-31

  clm.income_multiple_caps:   {owner: Credit Committee,    cadence: semi-annual}
  clm.spend_cap_parameters:   {owner: Credit Risk Policy,  cadence: quarterly}
  clm.cooling_off_windows:    {owner: Credit Risk Policy,  cadence: annual}
  clm.notice_requirements:    {owner: Compliance,          cadence: on regulation}
  clm.minimum_payment_rates:  {owner: Product,             cadence: annual}
  clm.ranking_coefficients:   {owner: ALCO + Model Risk,   cadence: monthly}
  clm.grade_boundaries:       {owner: Model Risk,          cadence: semi-annual}
  clm.behavioural:            {owner: Model Risk,          cadence: on model release}
  clm.evidence_tiers:         {owner: Credit Risk Policy + Compliance, cadence: quarterly}
  clm.business_calendar:      {owner: Credit Systems,      cadence: annual}
  clm.offer_wording:          {owner: Compliance,          cadence: on change}

# scenario 6: the regulator shortens notice in one jurisdiction from 30 to 21
# days, effective on a date, with decisions before that date governed by the old
# period. That is two rows in clm.notice_requirements with adjacent effective
# ranges, and nothing else changes anywhere.
