# Contact interval rules — 7 channels x 8 buckets x 4 values.
# Owner: Collections Strategy. Co-signed: Regulatory Compliance. Cadence: quarterly.
# Version 17, effective 2026-07-01.
#
# `min_interval_days` and `max_attempts_before_escalation` are declared
# `overlay_direction: tighten_only` in path/sequence.py, which means a commercial
# overlay may LENGTHEN an interval (be more conservative) and can never shorten
# one. The combiner is max(), not assignment, and that is enforced by the surface
# declaration rather than by reviewer vigilance. See overlays/guard.py.
#
# The absolute caps at the bottom are Compliance-owned and are NOT an overlay
# surface at all. An overlay naming them fails at authoring time.

version: 17
effective_from: 2026-07-01
owner: collections_strategy
co_sign: regulatory_compliance
approval_reference: CS-INT-2026-06-19

channels:

  sms:
    channel_code: 1
    buckets:
      "1-2": {min_interval_days: 4, max_attempts_before_escalation: 3, max_in_rolling_window: 5, rolling_window_days: 14}
      "3-5": {min_interval_days: 3, max_attempts_before_escalation: 3, max_in_rolling_window: 6, rolling_window_days: 14}
      "6-8": {min_interval_days: 3, max_attempts_before_escalation: 3, max_in_rolling_window: 6, rolling_window_days: 14}

  email:
    channel_code: 2
    buckets:
      "1-2": {min_interval_days: 3, max_attempts_before_escalation: 4, max_in_rolling_window: 8, rolling_window_days: 14}
      "3-5": {min_interval_days: 2, max_attempts_before_escalation: 4, max_in_rolling_window: 10, rolling_window_days: 14}
      "6-8": {min_interval_days: 2, max_attempts_before_escalation: 4, max_in_rolling_window: 10, rolling_window_days: 14}

  in_app:
    channel_code: 3
    buckets:
      "1-2": {min_interval_days: 2, max_attempts_before_escalation: 5, max_in_rolling_window: 10, rolling_window_days: 14}
      "3-5": {min_interval_days: 2, max_attempts_before_escalation: 5, max_in_rolling_window: 12, rolling_window_days: 14}
      "6-8": {min_interval_days: 2, max_attempts_before_escalation: 5, max_in_rolling_window: 12, rolling_window_days: 14}

  voice_message:
    channel_code: 4
    buckets:
      "1-2": {min_interval_days: 5, max_attempts_before_escalation: 2, max_in_rolling_window: 3, rolling_window_days: 14}
      "3-5": {min_interval_days: 4, max_attempts_before_escalation: 2, max_in_rolling_window: 4, rolling_window_days: 14}
      "6-8": {min_interval_days: 3, max_attempts_before_escalation: 2, max_in_rolling_window: 4, rolling_window_days: 14}

  agent_call:
    channel_code: 5
    buckets:
      "1-2": {min_interval_days: 2, max_attempts_before_escalation: 4, max_in_rolling_window: 6, rolling_window_days: 7}
      "3-5": {min_interval_days: 1, max_attempts_before_escalation: 4, max_in_rolling_window: 8, rolling_window_days: 7}
      "6-8": {min_interval_days: 1, max_attempts_before_escalation: 4, max_in_rolling_window: 8, rolling_window_days: 7}
    note: >
      max_attempts_before_escalation is PER POSITION for agent calls, not per
      episode. The distinction matters and it is carried by
      PathState.attempts_at_position rather than by a channel counter.

  field_visit:
    channel_code: 6
    buckets:
      "1-2": {min_interval_days: null, max_attempts_before_escalation: 0, max_in_rolling_window: 0, rolling_window_days: 30}
      "3-5": {min_interval_days: 21, max_attempts_before_escalation: 2, max_in_rolling_window: 2, rolling_window_days: 60}
      "6-8": {min_interval_days: 14, max_attempts_before_escalation: 2, max_in_rolling_window: 3, rolling_window_days: 60}
    note: >
      null min_interval_days means the channel is unavailable in that bucket, not
      that the interval is zero. `i1 | None` in the Grid schema, and the lookup
      returns Optional so no downstream step can read a garbage slot (doc 03 §1).

  letter:
    channel_code: 7
    buckets:
      "1-8": {min_interval_days: 10, max_attempts_before_escalation: 3, max_in_rolling_window: 3, rolling_window_days: 60}

# ---------------------------------------------------------------------------
# Absolute caps. No bucket may exceed these. PER CLIENT, not per account.
# Owner: Regulatory Compliance. NOT overlayable, at any authority level.
# ---------------------------------------------------------------------------
absolute_caps:
  grain: client_id
  owner: regulatory_compliance
  overlayable: false
  caps:
    - {window: 1d,  channel_group: any,    cap: 3}
    - {window: 1d,  channel_group: spoken, cap: 2}
    - {window: 7d,  channel_group: any,    cap: 10}
    - {window: 30d, channel_group: any,    cap: 24}
  change_scenario_3_note: >
    "Compliance tightens contact frequency from 10 per 7 days to 6, per client
    rather than per account, effective on a date, with the old rule governing
    everything before it." The 7d cap becomes 6, the grain is already client_id,
    and the effective date is a new version of this document. Decisions before
    that date resolve version 17 by decision_date and are unaffected — which is
    the whole reason every artefact here is effective-dated rather than current.
