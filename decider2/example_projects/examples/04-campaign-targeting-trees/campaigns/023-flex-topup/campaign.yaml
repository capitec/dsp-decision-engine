# One campaign.  Eleven campaign owners own sixty of these.  Adding campaign 61
# costs exactly this file plus a trees/ directory; retiring campaign 41 sets
# `state: retired` and leaves every published tree version, identity map, route
# dictionary and node_meta table in place forever (spec §9.6).

campaign_id: 23
tree_id: 23
name: "Flex Loan pre-approved top-up"
product_code: 10                       # 00 §5 catalogue
state: live                            # live | paused | suspended | retired
owner: campaign_owner_11
credit_campaign: true                  # => Credit Risk co-signs every tree change
created: 2024-03-01

candidate_population:
  # Set-shaped, evaluated once per cycle in the frame tier.  Deliberately NOT in
  # the tree: the tree decides what to do with a client, the candidate population
  # decides who is even asked.  Keeping them separate is what makes "node volumes
  # are comparable month on month" mean something — a population change and a
  # tree change are then different events.
  expression: "has_active_flex_loan and not flex_account_closed"
  expected_size: 6_400_000
  size_tolerance: 0.15                 # a 15% move raises before the cycle runs

permitted_channels: [sms, in_app, outbound_call, email]

measurement:
  holdout_design_version: 7
  control_fraction: 0.05
  variant_design_version: 3
  variants:
    champion:      {tree_version: 11, share: 0.90}
    challenger_a:  {tree_version: 12, share: 0.10}
  windows:
    - id: "MW-2026-03"
      from: 2026-07-01
      to:   2026-12-31
      note: "Uplift measurement on the v11 re-fit."

publication:
  population_impact_bound: 0.25        # §5.9.7 default +/-25%
  route_budget: 50_000                 # §5.9 implied check
  signoff_required: [campaign_owner, credit_risk_policy]

arbitration:
  forum_weight: 1.00                   # registries/arbitration_weights.csv mirrors this
  ev_weight: 0.65
  expected_margin_cents_by_tier: {A: 1_840_00, B: 1_120_00, C: 610_00}

versions:
  # The register the cycle resolves against.  Never a directory listing.
  - {tree_version: 10, effective_from: 2026-04-01, effective_to: 2026-09-01, variant: champion}
  - {tree_version: 11, effective_from: 2026-09-01, effective_to: null,       variant: champion}
  - {tree_version: 12, effective_from: 2026-10-01, effective_to: null,       variant: champion,
     note: "Volume dial OV-2026-114 folded into the tree at the forum's request; see identity_maps/v11_to_v12.json"}
