# Scenario 3: a new campaign added MID-CYCLE, between monthly runs.
#
# The whole cost of adding campaign 61 is this file, a trees/ directory with one
# published version, and a row in registries/campaigns.csv.  Nothing is edited:
# no pipeline file, no shared module, no other campaign's anything.  The monthly
# pipeline assembles its campaign stages from `live_campaigns(as_at=cycle_date)`,
# so a campaign that becomes live on the 14th is in the 15th's delta and in the
# next monthly run, and is absent from every cycle before it by effective dating
# rather than by an `if`.
#
# What it does NOT get for free, and the manifest amendment says so: capacity.
# Campaign 61 claims SMS volume that is already committed, so `Arbitration`'s
# channel capacity is a zero-sum reallocation and the forum sees the refused
# demand it caused in the first cycle's report.

campaign_id: 61
tree_id: 61
name: "Drive Finance settlement offer"
product_code: 30
state: live
owner: campaign_owner_4
credit_campaign: true
created: 2026-09-14

candidate_population:
  expression: "has_drive_finance and drive_term_remaining_months <= 18"
  expected_size: 310_000
  size_tolerance: 0.25

permitted_channels: [outbound_call, sms, in_app]

measurement:
  holdout_design_version: 1
  control_fraction: 0.10          # new tree, so 10% until the first window closes
  variant_design_version: 1
  variants:
    champion: {tree_version: 1, share: 1.00}

publication:
  population_impact_bound: 1.00   # no prior volume to compare against
  route_budget: 50_000
  signoff_required: [campaign_owner, credit_risk_policy]

arbitration:
  forum_weight: 0.70              # new campaigns start below the incumbents
  ev_weight: 0.65
  capacity_claim: {outbound_call: 22_000, sms: 180_000}

versions:
  - {tree_version: 1, effective_from: 2026-09-14, effective_to: null, variant: champion}
