[pytest]
testpaths = .
markers =
    smoke: fast core user stories (the whole subset runs in under 3 minutes)
    full: everything that is not smoke, serve or slow (applied automatically)
    serve: builds a project and starts a real `decikit serve`
    slow: large trees or long flows
# Screenshots and traces of failing tests only; never under /tmp.
addopts = --screenshot only-on-failure --tracing retain-on-failure --output ../../../.scratch/ui-e2e-artifacts
