[project]
name = "decider"
dynamic = ["version"]
description = "Build, serve and inspect decision pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars",
    "pydantic>=2",
    "pydantic-settings",
    "click",
    "numba>=0.67.0",
    "packaging",
]

[project.optional-dependencies]
serve-starlette = ["uvicorn", "starlette"]
serve-sanic     = ["sanic"]
visualise       = ["streamlit", "graphviz"]
notebook        = ["ipython"]
experiments     = ["altair", "ipython", "markdown-it-py"]
eval            = ["simpleeval"]
yaml            = ["pyyaml"]
mcp             = ["fastmcp>=4.0.10"]
prove           = ["z3-solver"]
dev = [
    "pytest",
    "pytest-asyncio",
    "anyio",
]
docs = [
    "sphinx",
    "furo",
    "myst-nb",
    "sphinx-design",
    "sphinx-sitemap",
]
all = [
    "uvicorn", "starlette",
    "sanic",
    "streamlit", "graphviz",
    "ipython",
    "altair",
    "simpleeval",
    "pyyaml",
    "fastmcp>=4.0.10",
    "z3-solver",
    "pytest",
    "pytest-asyncio",
    "anyio",
    "sphinx",
    "furo",
    "myst-nb",
    "sphinx-design",
    "sphinx-sitemap",
]

[project.scripts]
decider = "decider._tooling.cli:cli"

# Packages that ship types for decider declare them in these entry-point groups,
# named by the type tag: decider.steps, decider.config_stores, decider.metrics,
# decider.plots, decider.blocks, decider.datasets, decider.checks. For example,
# in the package's own pyproject.toml:
#   [project.entry-points."decider.steps"]
#   scaled = "credit_risk.steps:Scaled"

# ── build ─────────────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# tag format: v{version}  e.g. v0.1.0
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"

[tool.hatch.build.targets.wheel]
packages = ["decider"]

# ── uv ────────────────────────────────────────────────────────────────────────

[tool.uv]
system-certs = true   # required: corporate proxy uses a private CA

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "anyio",
    "pytest-cov>=7.1.0",
    "starlette>=1.2.1",
    "ipython>=8.39.0",
    "altair",
    "fastmcp>=4.0.10",
    "z3-solver",
]

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
