[project]
name = "d2shim-skb"
version = "0.0.1"
requires-python = ">=3.10"

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/d2shim_skb"]
wheel.py-api = "py3"            # no Python ABI involved -> py3-none-<platform>
cmake.version = ">=3.15"
wheel.exclude = ["**/c/*.c", "**/vendor/*.c", "**/vendor/**/*.h"]   # else the sources ride along in the wheel
