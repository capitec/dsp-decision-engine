[project]
name = "d2shim-hatch"
version = "0.0.1"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2shim_hatch"]
exclude = ["src/d2shim_hatch/c", "src/d2shim_hatch/vendor"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
