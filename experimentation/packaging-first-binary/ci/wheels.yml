# Build + test the wheel matrix for decider2's compiled string shim.
# NOT installed in .github/ — this is the prototype's proposal. Copy to
# .github/workflows/wheels.yml and change `package-dir` when adopted.
#
# Matrix: one abi3 wheel per platform (cp310+), built from cp310, tested on
# the oldest and newest supported CPython inside cibuildwheel, plus an sdist.
#
# Rough cost per run (GitHub-hosted runners, measured leg in RESULTS.md §6):
#   ubuntu-24.04      x86_64   ~4 min   (image pull ~1 min, build+repair ~1.5 min, test ~1.5 min)
#   ubuntu-24.04-arm  aarch64  ~4 min   (native arm runner: no QEMU, so no 10x penalty)
#   macos-13          x86_64   ~4 min
#   macos-14          arm64    ~3 min
#   windows-2022      AMD64    ~6 min   (MSVC + polars/numba install is the slow part)
#   sdist + vendor-provenance check       ~1 min
#   -> ~22 runner-minutes wall, ~5 min critical path (jobs run in parallel).
#   Private-repo billing multipliers: Linux 1x, Windows 2x, macOS 10x -> ~95 billed minutes
#   per run; on a public repo, free. Run on tags + a weekly cron, not every push.
name: wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["decider2/src/decider2/c/**", "decider2/src/decider2/vendor/**", "decider2/pyproject.toml", ".github/workflows/wheels.yml"]
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches toolchain / image drift before a release does
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    # The vendored nanoarrow must match its recorded hashes, and the header's
    # version must match the pin, before anything is compiled from it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: verify vendored nanoarrow against SHA512SUMS and VERSION
        working-directory: decider2/src/decider2/vendor
        run: |
          sha512sum -c SHA512SUMS
          pin=$(sed -n '1s/^nanoarrow \([0-9.]*\).*/\1/p' VERSION)
          hdr=$(sed -n 's/^#define NANOARROW_VERSION "\(.*\)"/\1/p' nanoarrow/nanoarrow.h)
          test "$pin" = "$hdr" && echo "nanoarrow $pin: manifest and header agree"

  sdist:
    needs: provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist --out-dir dist decider2
      - name: the sdist must build a working wheel on its own (catches a missing header, as happened in the prototype)
        run: |
          uv venv --python 3.12 .v && uv pip install -p .v/bin/python dist/*.tar.gz pytest
          .v/bin/python -c "import decider2.strings as s; print(s.which())"
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }

  wheels:
    needs: provenance
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-13, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Run from INSIDE the package dir: `test-sources` in [tool.cibuildwheel]
      # resolves against the cwd, not package-dir (bit the prototype twice).
      # All selection lives in pyproject.toml: build = "cp310-*", abi3,
      # manylinux_2_28, test-sources = ["tests"], test on the built wheel.
      - name: cibuildwheel
        working-directory: decider2
        run: |
          rm -rf build           # setuptools reuses stale objects in build/ across flag changes
          pipx run cibuildwheel==4.2.1 --output-dir ../wheelhouse .
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  # The no-wheel path must keep working: the pure-numba fallback is what a
  # platform outside the matrix (or an air-gapped box) actually runs.
  fallback:
    needs: provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv venv --python 3.12 .v && uv pip install -p .v/bin/python -e decider2 pytest
          DECIDER2_STRINGS=pure .v/bin/python -m pytest decider2/tests -q

  collect:
    needs: [sdist, wheels, fallback]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: exactly one wheel per platform, all abi3, plus the sdist
        run: |
          ls -la dist
          test $(ls dist/*.whl | wc -l) -eq 5
          ls dist/*.whl | grep -v 'cp310-abi3' && exit 1 || true
      # Publishing (pypi / internal index) goes here, behind an environment
      # with required reviewers; out of scope for the prototype.
