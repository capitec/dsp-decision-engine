[package]
name = "decider_trees"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "decider_trees"
crate-type = ["cdylib"]

[dependencies]
# pyo3-polars 0.28 pins polars 0.55.1 and pyo3 0.29 (see Cargo.lock / RESULTS.md §3).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-polars = { version = "0.28", features = ["derive", "dtype-categorical"] }
polars = { version = "0.55", default-features = false }
polars-core = { version = "0.55", default-features = false }
polars-arrow = { version = "0.55", default-features = false }
serde = { version = "1", features = ["derive"] }
serde-pickle = "1"
regex = "1"
rayon = "1"

[profile.release]
opt-level = 3
