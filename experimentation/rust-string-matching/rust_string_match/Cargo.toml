[package]
name = "rust_string_match"
version = "0.1.0"
edition = "2021"
publish = false

# Crate-wide default `panic = "unwind"` is deliberate: `catch_unwind` at
# every `extern "C"` boundary is the safety discipline demonstrated here,
# and under `panic = "abort"` there is nothing for it to catch (see
# ../rust-cabi-in-kernel/rust_cabi_tree/Cargo.toml for the same reasoning).

[lib]
name = "rust_string_match"
crate-type = ["cdylib"]

[dependencies]
regex = "1.12"
memchr = "2"

[profile.release]
opt-level = 3
