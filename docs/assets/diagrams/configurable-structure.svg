<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="432" fill="#ffffff"/>

  <!-- code repository -->
  <rect x="16" y="16" width="500" height="400" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="42" font-size="15" font-weight="600" fill="#1f2937">Code repository: reviewed and deployed</text>
  <rect x="34" y="58" width="300" height="56" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="184" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d00">pipeline.py</text>
  <text x="184" y="102" text-anchor="middle" font-size="13" fill="#7c2d00">build(tree) returns flow(..., tree, ...)</text>
  <rect x="34" y="150" width="300" height="56" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="184" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d00">flow.yaml, flows/*.yaml</text>
  <text x="184" y="194" text-anchor="middle" font-size="13" fill="#7c2d00">structure as data, next to the code</text>
  <rect x="34" y="242" width="300" height="56" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="184" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d00">components package</text>
  <text x="184" y="286" text-anchor="middle" font-size="13" fill="#7c2d00">step functions and Step objects</text>
  <rect x="34" y="322" width="300" height="78" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="184" y="346" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d00">ConfigurableStep classes</text>
  <text x="184" y="366" text-anchor="middle" font-size="13" fill="#7c2d00">TreeConfig, DecisionTableConfig,</text>
  <text x="184" y="384" text-anchor="middle" font-size="13" fill="#7c2d00">ScorecardConfig, your own</text>
  <line x1="184" y1="206" x2="184" y2="240" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="194" y="228" font-size="13" fill="#1f2937">step: name</text>

  <!-- config version -->
  <rect x="584" y="16" width="400" height="400" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="602" y="42" font-size="15" font-weight="600" fill="#1f2937">Config version: edited and activated</text>
  <rect x="640" y="58" width="320" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="800" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">"params" document</text>
  <text x="800" y="102" text-anchor="middle" font-size="13" fill="#14532d">{"credit": {"decide": {"cut": 0.7}}}</text>
  <rect x="640" y="150" width="320" height="250" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="800" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">documents by name</text>
  <text x="800" y="274" text-anchor="middle" font-size="13" fill="#14532d">"tree": {"type": "tree", ...}</text>
  <text x="800" y="294" text-anchor="middle" font-size="13" fill="#14532d">"pricing": {"type": "decision_table", ...}</text>

  <!-- arrows -->
  <line x1="638" y1="86" x2="336" y2="86" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="78" font-size="13" fill="#1f2937">read on every run</text>
  <polyline points="638,166 560,166 560,106 336,106" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="126" font-size="13" fill="#1f2937">passed by argument name</text>
  <line x1="638" y1="186" x2="336" y2="186" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="178" font-size="13" fill="#1f2937">step: name (documents=)</text>
  <line x1="638" y1="362" x2="336" y2="362" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="354" font-size="13" fill="#1f2937">"type" tag</text>
</svg>
