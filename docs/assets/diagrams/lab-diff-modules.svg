<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <!-- layer labels -->
  <text x="20" y="22" font-size="13" fill="#6b7280">callers outside the package</text>
  <text x="20" y="152" font-size="13" fill="#6b7280">decider.lab.diff (public)</text>
  <text x="980" y="400" font-size="13" fill="#6b7280" text-anchor="end">private modules</text>

  <!-- row 1 -->
  <rect x="20" y="32" width="300" height="74" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="56" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="600">experiments</text>
  <text x="170" y="76" font-size="13" fill="#4c1d95" text-anchor="middle">Divergence imports changed;</text>
  <text x="170" y="94" font-size="13" fill="#4c1d95" text-anchor="middle">the runner imports the git helpers</text>

  <rect x="440" y="32" width="240" height="74" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="560" y="56" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="600">decider diff (CLI)</text>
  <text x="560" y="76" font-size="13" fill="#4c1d95" text-anchor="middle">revisions(...).outputs(),</text>
  <text x="560" y="94" font-size="13" fill="#4c1d95" text-anchor="middle">then .structure()</text>

  <rect x="720" y="32" width="260" height="74" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="850" y="56" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="600">structure checks</text>
  <text x="850" y="76" font-size="13" fill="#4c1d95" text-anchor="middle">import _smt lazily for unreachable</text>
  <text x="850" y="94" font-size="13" fill="#4c1d95" text-anchor="middle">arms and table overlaps</text>

  <!-- row 2 -->
  <rect x="20" y="162" width="180" height="70" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="190" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">structure</text>
  <text x="110" y="210" font-size="13" fill="#1e3a8a" text-anchor="middle">StructureDiff</text>

  <rect x="240" y="162" width="180" height="70" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="190" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">outputs</text>
  <text x="330" y="210" font-size="13" fill="#1e3a8a" text-anchor="middle">OutputDiff</text>

  <rect x="460" y="162" width="200" height="70" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="560" y="190" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">revisions</text>
  <text x="560" y="210" font-size="13" fill="#1e3a8a" text-anchor="middle">Revisions</text>

  <rect x="720" y="162" width="260" height="70" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="850" y="190" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">prove</text>
  <text x="850" y="210" font-size="13" fill="#1e3a8a" text-anchor="middle">Proof; calls structure() first</text>

  <!-- row 3 -->
  <rect x="20" y="302" width="130" height="72" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="85" y="328" font-size="14" fill="#134e4a" text-anchor="middle">_hash</text>
  <text x="85" y="348" font-size="13" fill="#134e4a" text-anchor="middle">snapshot</text>

  <rect x="165" y="302" width="130" height="72" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="230" y="328" font-size="14" fill="#134e4a" text-anchor="middle">_structure</text>
  <text x="230" y="348" font-size="13" fill="#134e4a" text-anchor="middle">compare</text>

  <rect x="310" y="302" width="150" height="72" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="385" y="328" font-size="14" fill="#134e4a" text-anchor="middle">_outputs</text>
  <text x="385" y="346" font-size="13" fill="#134e4a" text-anchor="middle">changed,</text>
  <text x="385" y="363" font-size="13" fill="#134e4a" text-anchor="middle">compare_frames</text>

  <rect x="475" y="302" width="150" height="72" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="550" y="328" font-size="14" fill="#134e4a" text-anchor="middle">_revisions</text>
  <text x="550" y="348" font-size="13" fill="#134e4a" text-anchor="middle">resolve, materialise</text>

  <rect x="640" y="302" width="130" height="72" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="705" y="328" font-size="14" fill="#134e4a" text-anchor="middle">_worker</text>
  <text x="705" y="348" font-size="13" fill="#134e4a" text-anchor="middle">subprocess</text>

  <rect x="800" y="302" width="180" height="72" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="890" y="328" font-size="14" fill="#134e4a" text-anchor="middle">_smt</text>
  <text x="890" y="348" font-size="13" fill="#134e4a" text-anchor="middle">z3 terms, differ</text>

  <!-- edges row1 -> row2 -->
  <line x1="560" y1="106" x2="560" y2="158" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- edges row2 -> row3 -->
  <line x1="90" y1="232" x2="85" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="140" y1="232" x2="215" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="350" y1="232" x2="375" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="232" x2="260" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="520" y1="232" x2="420" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="560" y1="232" x2="550" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="620" y1="232" x2="690" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="880" y1="232" x2="885" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- worker -> hash, routed below -->
  <path d="M705,374 L705,412 L85,412 L85,378" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="395" y="436" font-size="13" fill="#1f2937" text-anchor="middle">the worker builds a Snapshot in the child process and pickles it back</text>
</svg>
