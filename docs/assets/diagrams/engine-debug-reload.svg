<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <text x="30" y="32" font-size="14" font-weight="600" fill="#1f2937">#</text>
  <text x="70" y="32" font-size="14" font-weight="600" fill="#1f2937">checkpoint (when, path)</text>
  <text x="440" y="32" font-size="14" font-weight="600" fill="#1f2937">content, old vs new</text>

  <!-- kept band rows 0-2 -->
  <rect x="20" y="44" width="560" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="30" y="66" font-size="13" fill="#14532d">0</text>
  <text x="70" y="66" font-size="13" fill="#14532d">before loan</text>
  <text x="440" y="66" font-size="13" fill="#14532d">same</text>
  <text x="30" y="92" font-size="13" fill="#14532d">1</text>
  <text x="70" y="92" font-size="13" fill="#14532d">before loan/disposable_income</text>
  <text x="440" y="92" font-size="13" fill="#14532d">same</text>
  <text x="30" y="118" font-size="13" fill="#14532d">2</text>
  <text x="70" y="118" font-size="13" fill="#14532d">after loan/disposable_income</text>
  <text x="440" y="118" font-size="13" fill="#14532d">same</text>

  <!-- changed band rows 3-13 -->
  <rect x="20" y="136" width="560" height="390" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <rect x="26" y="142" width="548" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="30" y="162" font-size="13" fill="#7f1d1d">3</text>
  <text x="70" y="162" font-size="13" fill="#7f1d1d">before loan/ratio</text>
  <text x="440" y="162" font-size="13" font-weight="600" fill="#7f1d1d">changed</text>
  <text x="30" y="184" font-size="13" fill="#7f1d1d">4</text>
  <text x="70" y="184" font-size="13" fill="#7f1d1d">after loan/ratio</text>
  <text x="440" y="184" font-size="13" font-weight="600" fill="#7f1d1d">changed</text>
  <text x="30" y="214" font-size="13" fill="#7c2d00">5</text>
  <text x="70" y="214" font-size="13" fill="#7c2d00">before loan/by_affordability</text>
  <text x="440" y="214" font-size="13" fill="#7c2d00">same</text>
  <text x="30" y="240" font-size="13" fill="#7c2d00">6</text>
  <text x="70" y="240" font-size="13" fill="#7c2d00">before .../affordable</text>
  <text x="440" y="240" font-size="13" fill="#7c2d00">same</text>
  <text x="30" y="266" font-size="13" fill="#7c2d00">7</text>
  <text x="70" y="266" font-size="13" fill="#7c2d00">after .../affordable</text>
  <text x="440" y="266" font-size="13" fill="#7c2d00">same</text>
  <rect x="26" y="276" width="548" height="28" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="30" y="295" font-size="13" fill="#4c1d95">8</text>
  <text x="70" y="295" font-size="13" fill="#4c1d95">before .../full_limit</text>
  <text x="440" y="295" font-size="13" fill="#4c1d95">same</text>
  <text x="30" y="324" font-size="13" fill="#7c2d00">9</text>
  <text x="70" y="324" font-size="13" fill="#7c2d00">after .../full_limit</text>
  <text x="440" y="324" font-size="13" fill="#7c2d00">same</text>
  <text x="30" y="350" font-size="13" fill="#7c2d00">10</text>
  <text x="70" y="350" font-size="13" fill="#7c2d00">before .../no_limit</text>
  <text x="440" y="350" font-size="13" fill="#7c2d00">same</text>
  <text x="30" y="376" font-size="13" fill="#7c2d00">11</text>
  <text x="70" y="376" font-size="13" fill="#7c2d00">after .../no_limit</text>
  <text x="440" y="376" font-size="13" fill="#7c2d00">same</text>
  <text x="30" y="402" font-size="13" fill="#7c2d00">12</text>
  <text x="70" y="402" font-size="13" fill="#7c2d00">after loan/by_affordability</text>
  <text x="440" y="402" font-size="13" fill="#7c2d00">same</text>
  <text x="30" y="428" font-size="13" fill="#7c2d00">13</text>
  <text x="70" y="428" font-size="13" fill="#7c2d00">after loan</text>
  <text x="440" y="428" font-size="13" fill="#7c2d00">same</text>
  <text x="70" y="466" font-size="13" fill="#7c2d00">Everything from the first difference on runs again,</text>
  <text x="70" y="486" font-size="13" fill="#7c2d00">even rows whose own content is the same: they may</text>
  <text x="70" y="506" font-size="13" fill="#7c2d00">read a value the changed step writes.</text>

  <!-- annotations -->
  <rect x="620" y="44" width="360" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="636" y="68" font-size="13" font-weight="600" fill="#14532d">Kept</text>
  <text x="636" y="90" font-size="13" fill="#14532d">values move across by (name, producer);</text>
  <text x="636" y="110" font-size="13" fill="#14532d">these nodes go in the runner's skip map</text>
  <line x1="620" y1="86" x2="584" y2="86" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="620" y="142" width="360" height="104" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="636" y="166" font-size="13" font-weight="600" fill="#7f1d1d">First difference: index 3</text>
  <text x="636" y="188" font-size="13" fill="#7f1d1d">Edited("replace", "loan/ratio") is emitted,</text>
  <text x="636" y="208" font-size="13" fill="#7f1d1d">then the replay stops here:</text>
  <text x="636" y="228" font-size="13" fill="#7f1d1d">Paused(reason="edit", when="before")</text>
  <line x1="620" y1="166" x2="584" y2="166" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="620" y="268" width="360" height="104" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="636" y="292" font-size="13" font-weight="600" fill="#4c1d95">Where the session was paused</text>
  <text x="636" y="314" font-size="13" fill="#4c1d95">before the reload. The session stops at</text>
  <text x="636" y="334" font-size="13" fill="#4c1d95">the earlier of this and the first difference,</text>
  <text x="636" y="354" font-size="13" fill="#4c1d95">so here it moves back to index 3.</text>
  <line x1="620" y1="290" x2="584" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
