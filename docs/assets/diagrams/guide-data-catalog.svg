<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <!-- datasets folder -->
  <rect x="20" y="20" width="300" height="430" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="40" y="50" font-size="16" font-weight="600" fill="#14532d">datasets/</text>
  <text x="40" y="70" font-size="13" fill="#14532d">beside configs/ (DECIDER_DATASETS_PATH)</text>
  <text x="48" y="110" font-size="14" fill="#14532d">clients.parquet</text>
  <text x="48" y="140" font-size="14" fill="#14532d">loans/</text>
  <text x="70" y="162" font-size="13" fill="#14532d">part-0.csv</text>
  <text x="70" y="182" font-size="13" fill="#14532d">part-1.csv</text>
  <text x="48" y="212" font-size="14" fill="#14532d">bureau/</text>
  <text x="70" y="234" font-size="13" fill="#14532d">region=za/part-0.parquet</text>
  <text x="70" y="254" font-size="13" fill="#14532d">region=na/part-0.parquet</text>
  <text x="48" y="290" font-size="14" fill="#14532d">config.json</text>
  <rect x="40" y="304" width="262" height="128" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="52" y="328" font-size="13" fill="#14532d">{"loans": {</text>
  <text x="64" y="348" font-size="13" fill="#14532d">"type": "folder",</text>
  <text x="64" y="368" font-size="13" fill="#14532d">"path": "loans",</text>
  <text x="64" y="388" font-size="13" fill="#14532d">"key": ["client_id"]}}</text>
  <text x="52" y="418" font-size="13" fill="#14532d">relative path: against datasets/</text>

  <!-- step boxes -->
  <rect x="370" y="60" width="250" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="385" y="88" font-size="15" font-weight="600" fill="#4c1d95">1. infer from files</text>
  <text x="385" y="112" font-size="13" fill="#4c1d95">name.csv|parquet|jsonl|ndjson|json</text>
  <text x="385" y="132" font-size="13" fill="#4c1d95">is "file"; a name/ folder is "folder"</text>

  <rect x="370" y="190" width="250" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="385" y="218" font-size="15" font-weight="600" fill="#4c1d95">2. config.json wins</text>
  <text x="385" y="242" font-size="13" fill="#4c1d95">an entry replaces the inferred</text>
  <text x="385" y="262" font-size="13" fill="#4c1d95">dataset of the same name</text>

  <rect x="370" y="320" width="250" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="385" y="348" font-size="15" font-weight="600" fill="#4c1d95">3. validate by type</text>
  <text x="385" y="372" font-size="13" fill="#4c1d95">DatasetProvider.resolve(type)</text>
  <text x="385" y="392" font-size="13" fill="#4c1d95">alias or "package.module:Class"</text>

  <path d="M320,120 L366,105" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M302,330 L366,245" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M495,150 L495,186" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M495,280 L495,316" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- providers -->
  <rect x="670" y="40" width="310" height="110" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="685" y="68" font-size="15" font-weight="600" fill="#7c2d00">clients: FileProvider</text>
  <text x="685" y="92" font-size="13" fill="#7c2d00">scan_parquet(path)</text>
  <text x="685" y="114" font-size="13" fill="#7c2d00">key None: load() suggests client_id</text>
  <text x="685" y="134" font-size="13" fill="#7c2d00">(id, then *_id, then id_*)</text>

  <rect x="670" y="170" width="310" height="110" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="685" y="198" font-size="15" font-weight="600" fill="#7c2d00">loans: FolderProvider</text>
  <text x="685" y="222" font-size="13" fill="#7c2d00">scan_csv("loans/*.csv")</text>
  <text x="685" y="244" font-size="13" fill="#7c2d00">key ("client_id",): load() rejects</text>
  <text x="685" y="264" font-size="13" fill="#7c2d00">null or duplicate keys</text>

  <rect x="670" y="300" width="310" height="110" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="685" y="328" font-size="15" font-weight="600" fill="#7c2d00">bureau: FolderProvider</text>
  <text x="685" y="352" font-size="13" fill="#7c2d00">scan_parquet("bureau/**/*.parquet",</text>
  <text x="685" y="372" font-size="13" fill="#7c2d00">hive_partitioning=True)</text>
  <text x="685" y="394" font-size="13" fill="#7c2d00">region=za/ becomes a region column</text>

  <path d="M620,365 L650,365 L650,95 L666,95" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M650,225 L666,225" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M650,355 L666,355" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
</svg>
