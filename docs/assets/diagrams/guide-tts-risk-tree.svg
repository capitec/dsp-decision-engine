<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>

  <!-- root -->
  <rect x="110" y="16" width="320" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="126" y="42" font-size="16" font-weight="600" fill="#1e3a8a">root (unary)</text>
  <text x="126" y="74" font-size="15" fill="#1e3a8a">debt_ratio &gt;</text>
  <rect x="220" y="56" width="200" height="26" rx="6" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="230" y="74" font-size="14" fill="#7c2d00">param max_ratio = 0.5</text>

  <!-- decline leaf -->
  <rect x="10" y="176" width="150" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="24" y="202" font-size="16" font-weight="600" fill="#14532d">decline</text>
  <text x="24" y="226" font-size="14" fill="#14532d">leaf, result_idx 0</text>

  <!-- bureau -->
  <rect x="190" y="176" width="310" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="206" y="202" font-size="16" font-weight="600" fill="#1e3a8a">bureau (cases, ranges)</text>
  <text x="206" y="228" font-size="14" fill="#1e3a8a">bureau_score in [lo, hi)</text>

  <path d="M200,92 L100,174" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="44" y="134" font-size="14" fill="#1f2937">0: holds</text>
  <path d="M320,92 L340,174" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="338" y="134" font-size="14" fill="#1f2937">1: otherwise, or null</text>

  <!-- leaves -->
  <rect x="10" y="330" width="150" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="24" y="356" font-size="16" font-weight="600" fill="#14532d">high</text>
  <text x="24" y="378" font-size="14" fill="#14532d">0: below 600</text>
  <text x="24" y="398" font-size="14" fill="#14532d">result_idx 1</text>
  <rect x="170" y="330" width="150" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="184" y="356" font-size="16" font-weight="600" fill="#14532d">medium</text>
  <text x="184" y="378" font-size="14" fill="#14532d">1: 600 to 700</text>
  <text x="184" y="398" font-size="14" fill="#14532d">result_idx 2</text>
  <rect x="330" y="330" width="150" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="344" y="356" font-size="16" font-weight="600" fill="#14532d">low</text>
  <text x="344" y="378" font-size="14" fill="#14532d">2: 700 and up</text>
  <text x="344" y="398" font-size="14" fill="#14532d">result_idx 3</text>
  <rect x="490" y="330" width="150" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="504" y="356" font-size="16" font-weight="600" fill="#1f2937">no edge</text>
  <text x="504" y="378" font-size="14" fill="#1f2937">3: no band, null</text>
  <text x="504" y="398" font-size="14" fill="#1f2937">default row</text>

  <path d="M260,246 L95,328" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M320,246 L250,328" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M380,246 L405,328" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M440,246 L560,328" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>

  <!-- output table -->
  <rect x="660" y="16" width="230" height="250" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="676" y="42" font-size="16" font-weight="600" fill="#14532d">output</text>
  <text x="676" y="72" font-size="14" font-weight="600" fill="#14532d">row</text>
  <text x="730" y="72" font-size="14" font-weight="600" fill="#14532d">risk_band</text>
  <text x="818" y="72" font-size="14" font-weight="600" fill="#14532d">max_term</text>
  <line x1="676" y1="82" x2="874" y2="82" stroke="#16a34a" stroke-width="1"/>
  <text x="676" y="106" font-size="14" fill="#14532d">0</text>
  <text x="730" y="106" font-size="14" fill="#14532d">decline</text>
  <text x="830" y="106" font-size="14" fill="#14532d">0</text>
  <text x="676" y="132" font-size="14" fill="#14532d">1</text>
  <text x="730" y="132" font-size="14" fill="#14532d">high</text>
  <text x="830" y="132" font-size="14" fill="#14532d">24</text>
  <text x="676" y="158" font-size="14" fill="#14532d">2</text>
  <text x="730" y="158" font-size="14" fill="#14532d">medium</text>
  <text x="830" y="158" font-size="14" fill="#14532d">48</text>
  <text x="676" y="184" font-size="14" fill="#14532d">3</text>
  <text x="730" y="184" font-size="14" fill="#14532d">low</text>
  <text x="830" y="184" font-size="14" fill="#14532d">72</text>
  <line x1="676" y1="196" x2="874" y2="196" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="676" y="220" font-size="14" fill="#14532d">default</text>
  <text x="740" y="220" font-size="14" fill="#14532d">refer</text>
  <text x="830" y="220" font-size="14" fill="#14532d">0</text>
  <text x="676" y="250" font-size="13" fill="#14532d">leaf picks data[result_idx]</text>

  <text x="660" y="300" font-size="14" fill="#1f2937">risk_leaf: the leaf's id,</text>
  <text x="660" y="320" font-size="14" fill="#1f2937">null on the default row</text>
  <text x="660" y="352" font-size="14" fill="#1f2937">risk_path: nodes walked,</text>
  <text x="660" y="372" font-size="14" fill="#1f2937">root&gt;bureau&gt;medium</text>
</svg>
