<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <!-- shared -->
  <rect x="20" y="20" width="420" height="520" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="38" y="48" font-size="16" font-weight="600" fill="#134e4a">Shared by every thread</text>
  <text x="38" y="70" font-size="13" fill="#134e4a">built once, then only read; a miss takes a lock</text>

  <rect x="38" y="86" width="384" height="104" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="52" y="110" font-size="14" font-weight="600" fill="#134e4a">Executable</text>
  <text x="52" y="132" font-size="13" fill="#134e4a">plan, nodes, ParamsCache, StepTable</text>
  <text x="52" y="152" font-size="13" fill="#134e4a">_checked, _warned: Cache filled by once()</text>
  <text x="52" y="172" font-size="13" fill="#134e4a">ParamsCache._results: setdefault, first wins</text>

  <rect x="38" y="202" width="384" height="124" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="52" y="226" font-size="14" font-weight="600" fill="#134e4a">runner._compiled: one Compiled snapshot</text>
  <text x="52" y="248" font-size="13" fill="#134e4a">units, reads, strs, fallbacks, packed</text>
  <text x="52" y="268" font-size="13" fill="#134e4a">built under runner._lock, published by one</text>
  <text x="52" y="288" font-size="13" fill="#134e4a">assignment; converted holds (bundle, utf8)</text>
  <text x="52" y="308" font-size="13" fill="#134e4a">pairs, written once with setdefault</text>

  <rect x="38" y="338" width="384" height="104" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="52" y="362" font-size="14" font-weight="600" fill="#134e4a">Module-global build caches (Cache + once)</text>
  <text x="52" y="384" font-size="13" fill="#134e4a">_DISPATCHERS, _REASONS (compile/njit.py)</text>
  <text x="52" y="404" font-size="13" fill="#134e4a">_KERNELS (compile/kernel.py)</text>
  <text x="52" y="424" font-size="13" fill="#134e4a">_DTYPES (structs.py), _LAYOUTS (rows.py)</text>

  <rect x="38" y="454" width="384" height="70" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="52" y="478" font-size="14" font-weight="600" fill="#134e4a">Other locks</text>
  <text x="52" y="500" font-size="13" fill="#134e4a">bundle classes, registry, RequestHandler swap</text>

  <!-- per thread -->
  <rect x="460" y="20" width="250" height="300" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="478" y="48" font-size="16" font-weight="600" fill="#4c1d95">Per thread</text>
  <text x="478" y="70" font-size="13" fill="#4c1d95">threading.local</text>
  <rect x="478" y="86" width="214" height="104" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="492" y="110" font-size="14" font-weight="600" fill="#4c1d95">FrameView pool</text>
  <text x="492" y="132" font-size="13" fill="#4c1d95">checkout("views", plan)</text>
  <text x="492" y="152" font-size="13" fill="#4c1d95">popped while in use,</text>
  <text x="492" y="172" font-size="13" fill="#4c1d95">checked in after release()</text>
  <rect x="478" y="202" width="214" height="104" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="492" y="226" font-size="14" font-weight="600" fill="#4c1d95">exe.report</text>
  <text x="492" y="248" font-size="13" fill="#4c1d95">Executable._latest, the</text>
  <text x="492" y="268" font-size="13" fill="#4c1d95">RunReport of this thread's</text>
  <text x="492" y="288" font-size="13" fill="#4c1d95">latest call</text>

  <!-- per call -->
  <rect x="730" y="20" width="250" height="300" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="748" y="48" font-size="16" font-weight="600" fill="#14532d">Per call</text>
  <text x="748" y="70" font-size="13" fill="#14532d">locals, passed down</text>
  <text x="748" y="102" font-size="13" fill="#14532d">State: values, valid, chains</text>
  <text x="748" y="126" font-size="13" fill="#14532d">RunParams and its report</text>
  <text x="748" y="150" font-size="13" fill="#14532d">_Context(trace, table,</text>
  <text x="748" y="168" font-size="13" fill="#14532d">compiled) and each _Scope</text>
  <text x="748" y="198" font-size="13" fill="#14532d">output and mask arrays</text>
  <text x="748" y="216" font-size="13" fill="#14532d">built in Kernel.run</text>
  <text x="748" y="246" font-size="13" fill="#14532d">trace header, cursor and</text>
  <text x="748" y="264" font-size="13" fill="#14532d">offsets buffers</text>
  <text x="748" y="294" font-size="13" fill="#14532d">the caller's TraceSink</text>

  <!-- not shared -->
  <rect x="460" y="338" width="520" height="202" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="478" y="366" font-size="16" font-weight="600" fill="#7f1d1d">Not thread-safe by contract</text>
  <text x="478" y="392" font-size="13" fill="#7f1d1d">Session: one per thread. It shallow-copies the runner, so it shares</text>
  <text x="478" y="412" font-size="13" fill="#7f1d1d">the immutable Compiled snapshot and sets visit and skip on its copy.</text>
  <text x="478" y="440" font-size="13" fill="#7f1d1d">TraceSink: one per call. Its counters are plain ints.</text>
  <text x="478" y="468" font-size="13" fill="#7f1d1d">The step functions users write: decikit cannot make them safe;</text>
  <text x="478" y="488" font-size="13" fill="#7f1d1d">the impure and mutates_input checks flag the usual ways they fail.</text>
  <text x="478" y="516" font-size="13" fill="#7f1d1d">Experiments, checks, diff, data loaders, the bridge, MCP.</text>
</svg>
