<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <!-- LoadedData -->
  <rect x="24" y="20" width="460" height="400" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="44" y="48" font-size="16" font-weight="600" fill="#14532d">LoadedData</text>

  <rect x="44" y="64" width="420" height="190" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="88" font-size="15" font-weight="600" fill="#14532d">summary: InputFingerprint</text>
  <g font-size="13" fill="#14532d" font-family="ui-monospace, monospace">
    <text x="64" y="116">dataset     'bureau'</text>
    <text x="64" y="142">fingerprint '5b027b5fe91c555d…'</text>
    <text x="64" y="168">columns     (('client_id', 'String'),</text>
    <text x="64" y="186">             ('score', 'Int64'),</text>
    <text x="64" y="204">             ('region', 'String'))</text>
    <text x="64" y="230">row_count   2</text>
  </g>

  <rect x="44" y="270" width="420" height="44" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="297" font-size="14" fill="#14532d">suggested_key: ('client_id',) or None</text>

  <rect x="44" y="328" width="420" height="44" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="355" font-size="14" fill="#14532d">_frame: pl.DataFrame  (private, not dumped)</text>
  <text x="44" y="400" font-size="13" fill="#14532d">.frame .columns .row_count .dataset .fingerprint read through</text>

  <!-- fingerprint recipe -->
  <text x="540" y="48" font-size="16" font-weight="600" fill="#1f2937">How the fingerprint is computed</text>
  <rect x="540" y="66" width="420" height="44" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="556" y="93" font-size="14" fill="#1f2937">b"decikit-frame-v1\n"  (format tag)</text>
  <rect x="540" y="124" width="420" height="44" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="556" y="151" font-size="14" fill="#1f2937">str(frame.schema)  (names, dtypes, order)</text>
  <rect x="540" y="182" width="420" height="44" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="556" y="209" font-size="14" fill="#1f2937">frame.hash_rows()  one u64 per row, in row order</text>

  <line x1="750" y1="226" x2="750" y2="262" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="540" y="264" width="420" height="52" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="750" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">sha256 over the three, in order</text>
  <text x="750" y="306" text-anchor="middle" font-size="13" fill="#134e4a">hexdigest; None for a frame with no columns</text>

  <polyline points="540,290 500,290 500,142 466,142" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="540" y="350" font-size="13" fill="#1f2937">A provider may override fingerprint(frame)</text>
  <text x="540" y="370" font-size="13" fill="#1f2937">with a cheaper identity (a table version, an ETag).</text>
</svg>
