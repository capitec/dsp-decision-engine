<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="system-ui, sans-serif">
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <!-- layer labels -->
  <g font-size="15" fill="#1f2937">
    <text x="24" y="58" font-weight="700" font-size="18">L4</text><text x="24" y="80">tooling</text>
    <text x="24" y="183" font-weight="700" font-size="18">L3</text><text x="24" y="205">libraries</text>
    <text x="24" y="296" font-weight="700" font-size="18" fill="#6b7280">L2</text><text x="24" y="318" fill="#6b7280">unused</text>
    <text x="24" y="405" font-weight="700" font-size="18">L1</text><text x="24" y="427">core</text>
    <text x="24" y="535" font-weight="700" font-size="18">L0</text><text x="24" y="557">foundation</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" marker-end="url(#down)">
    <line x1="60" y1="92" x2="60" y2="160"/>
    <line x1="60" y1="216" x2="60" y2="276"/>
    <line x1="60" y1="330" x2="60" y2="384"/>
    <line x1="60" y1="440" x2="60" y2="512"/>
  </g>

  <!-- L4 tooling -->
  <g font-size="14">
    <rect x="160" y="24" width="200" height="76" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="260" y="54" text-anchor="middle" font-weight="700" fill="#4c1d95">serving</text>
    <text x="260" y="76" text-anchor="middle" fill="#4c1d95">RequestHandler, HTTP apps</text>
    <rect x="370" y="24" width="200" height="76" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="470" y="54" text-anchor="middle" font-weight="700" fill="#4c1d95">_tooling/cli</text>
    <text x="470" y="76" text-anchor="middle" fill="#4c1d95">the decikit command</text>
    <rect x="580" y="24" width="200" height="76" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="680" y="54" text-anchor="middle" font-weight="700" fill="#4c1d95">_tooling/mcp</text>
    <text x="680" y="76" text-anchor="middle" fill="#4c1d95">decikit mcp server</text>
    <rect x="790" y="24" width="190" height="76" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="885" y="54" text-anchor="middle" font-weight="700" fill="#4c1d95">_tooling/bridge</text>
    <text x="885" y="76" text-anchor="middle" fill="#4c1d95">editor debug bridge</text>
  </g>

  <!-- L3 lab -->
  <rect x="160" y="128" width="820" height="112" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="176" y="152" font-size="15" font-weight="700" fill="#4c1d95">lab</text>
  <text x="212" y="152" font-size="14" fill="#4c1d95">work on a flow away from serving (credit is mapped here, not built yet)</text>
  <g font-size="14" fill="#4c1d95" text-anchor="middle">
    <rect x="172" y="164" width="124" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="234" y="190" font-weight="700">_refs</text><text x="234" y="211">_describe</text>
    <rect x="306" y="164" width="124" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="368" y="190" font-weight="700">data</text><text x="368" y="211">read, datasets</text>
    <rect x="440" y="164" width="124" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="502" y="190" font-weight="700">checks</text><text x="502" y="211">findings</text>
    <rect x="574" y="164" width="124" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="636" y="190" font-weight="700">diff</text><text x="636" y="211">versions, proof</text>
    <rect x="708" y="164" width="124" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="770" y="190" font-weight="700">testing</text><text x="770" y="211">equivalence</text>
    <rect x="842" y="164" width="126" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="905" y="190" font-weight="700">experiments</text><text x="905" y="211">scenarios</text>
  </g>

  <!-- L2 unused -->
  <rect x="160" y="276" width="820" height="54" rx="9" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="570" y="308" font-size="14" text-anchor="middle" fill="#6b7280">no package sits at layer 2 in tests/test_conventions.py</text>

  <!-- L1 core -->
  <g font-size="14" text-anchor="middle">
    <rect x="160" y="370" width="156" height="90" rx="9" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
    <text x="238" y="400" font-weight="700" fill="#7c2d00">decikit</text>
    <text x="238" y="421" fill="#7c2d00">__init__.py</text>
    <text x="238" y="442" fill="#7c2d00">authoring names</text>
    <rect x="326" y="370" width="156" height="90" rx="9" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
    <text x="404" y="400" font-weight="700" fill="#7c2d00">steps</text>
    <text x="404" y="421" fill="#7c2d00">constructors, trees,</text>
    <text x="404" y="442" fill="#7c2d00">tables, scorecards</text>
    <rect x="492" y="370" width="156" height="90" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="570" y="400" font-weight="700" fill="#1e3a8a">ir, trace, debug</text>
    <text x="570" y="421" fill="#1e3a8a">public facades</text>
    <text x="570" y="442" fill="#1e3a8a">over _engine</text>
    <rect x="658" y="370" width="156" height="90" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="736" y="400" font-weight="700" fill="#14532d">config</text>
    <text x="736" y="421" fill="#14532d">versioned params</text>
    <text x="736" y="442" fill="#14532d">and documents</text>
    <rect x="824" y="370" width="156" height="90" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="902" y="400" font-weight="700" fill="#134e4a">_engine</text>
    <text x="902" y="421" fill="#134e4a">IR, wiring, params,</text>
    <text x="902" y="442" fill="#134e4a">compile, run, debug</text>
  </g>

  <!-- L0 foundation -->
  <g font-size="14" text-anchor="middle" fill="#1f2937">
    <rect x="160" y="500" width="126" height="76" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="223" y="530" font-weight="700">exceptions</text><text x="223" y="552">DecikitError</text>
    <rect x="298" y="500" width="126" height="76" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="361" y="530" font-weight="700">ops</text><text x="361" y="552">Text, Currency</text>
    <rect x="436" y="500" width="126" height="76" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="499" y="530" font-weight="700">_registry</text><text x="499" y="552">type tags</text>
    <rect x="574" y="500" width="126" height="76" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="637" y="530" font-weight="700">_serde</text><text x="637" y="552">JSON frames</text>
    <rect x="712" y="500" width="126" height="76" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="775" y="530" font-weight="700">_settings</text><text x="775" y="552">env settings</text>
    <rect x="850" y="500" width="130" height="76" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="915" y="530" font-weight="700">_suggest</text><text x="915" y="552">did you mean</text>
  </g>
</svg>
