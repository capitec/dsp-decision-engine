<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <!-- step tree -->
  <rect x="30" y="20" width="440" height="270" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="50" y="46" font-size="15" font-weight="600" fill="#7c2d00">step tree (paths)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7c2d00">
    <text x="50" y="80">credit</text>
    <text x="74" y="106">disposable</text>
    <text x="74" y="132">dti</text>
    <text x="74" y="158">base_limit</text>
    <text x="74" y="184">by_tier</text>
    <text x="98" y="210">prime</text>
    <text x="98" y="236">near_prime</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7c2d00">
    <text x="210" y="158">multiple = param(3.0)</text>
    <text x="210" y="210">base = param(0.10)</text>
    <text x="210" y="236">base = param(0.15)</text>
  </g>
  <text x="50" y="270" font-size="13" fill="#7c2d00">steps without params (disposable, dti) have no entry</text>

  <!-- params document -->
  <rect x="530" y="20" width="440" height="270" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="550" y="46" font-size="15" font-weight="600" fill="#14532d">params document (JSON)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#14532d">
    <text x="550" y="80">{"credit": {</text>
    <text x="574" y="106">"base_limit": {"multiple": 3.0},</text>
    <text x="574" y="132">"by_tier": {</text>
    <text x="598" y="158">"prime": {"base": 0.10},</text>
    <text x="598" y="184">"near_prime": {"base": 0.15}</text>
    <text x="574" y="210">}</text>
    <text x="550" y="236">}}</text>
  </g>
  <text x="550" y="270" font-size="13" fill="#14532d">one nesting level per path segment, then the param</text>

  <line x1="395" y1="153" x2="568" y2="104" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="205" x2="592" y2="156" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- API row -->
  <rect x="30" y="330" width="290" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="356" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">pipeline.parameters()</text>
  <text x="175" y="380" text-anchor="middle" font-size="13" fill="#1e3a8a">the schema, keyed by path:</text>
  <text x="175" y="400" text-anchor="middle" font-size="13" fill="#1e3a8a">type, default, ge / le, required,</text>
  <text x="175" y="420" text-anchor="middle" font-size="13" fill="#1e3a8a">shared params under "shared"</text>

  <rect x="355" y="330" width="290" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="356" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">.defaults()</text>
  <text x="500" y="380" text-anchor="middle" font-size="13" fill="#14532d">a complete document of every</text>
  <text x="500" y="400" text-anchor="middle" font-size="13" fill="#14532d">default, ready to edit and save</text>
  <text x="500" y="420" text-anchor="middle" font-size="13" fill="#14532d">as configs/&lt;version&gt;/params.json</text>

  <rect x="680" y="330" width="290" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="825" y="356" text-anchor="middle" font-size="15" font-weight="600" fill="#7f1d1d">.validate(doc)</text>
  <text x="825" y="380" text-anchor="middle" font-size="13" fill="#7f1d1d">a Validation: .errors lists</text>
  <text x="825" y="400" text-anchor="middle" font-size="13" fill="#7f1d1d">problems, .check() raises</text>
  <text x="825" y="420" text-anchor="middle" font-size="13" fill="#7f1d1d">ParamsError naming the path</text>

  <line x1="320" y1="385" x2="351" y2="385" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="645" y1="385" x2="676" y2="385" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
