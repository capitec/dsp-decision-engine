<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <rect x="30" y="20" width="260" height="60" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="160" y="46" font-size="15" font-weight="600" fill="#7c2d00" text-anchor="middle">diff.prove(old, new)</text>
  <text x="160" y="66" font-size="13" fill="#7c2d00" text-anchor="middle">runs diff.structure first</text>

  <!-- tier 1 -->
  <rect x="30" y="120" width="260" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="146" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">IR content hashes equal?</text>
  <text x="160" y="168" font-size="13" fill="#1e3a8a" text-anchor="middle">code, consts, inputs, outputs,</text>
  <text x="160" y="186" font-size="13" fill="#1e3a8a" text-anchor="middle">params and tree shape;</text>
  <text x="160" y="204" font-size="13" fill="#1e3a8a" text-anchor="middle">names and paths ignored</text>

  <rect x="400" y="130" width="250" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="525" y="158" font-size="15" font-weight="600" fill="#14532d" text-anchor="middle">tier="ir_hash"</text>
  <text x="525" y="180" font-size="13" fill="#14532d" text-anchor="middle">identical=True</text>

  <!-- gate to smt -->
  <rect x="30" y="250" width="260" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="160" y="276" font-size="15" font-weight="600" fill="#4c1d95" text-anchor="middle">z3 can be asked?</text>
  <text x="160" y="298" font-size="13" fill="#4c1d95" text-anchor="middle">decider[prove] installed,</text>
  <text x="160" y="316" font-size="13" fill="#4c1d95" text-anchor="middle">no param changed, nothing added,</text>
  <text x="160" y="334" font-size="13" fill="#4c1d95" text-anchor="middle">removed, renamed, moved or rewired;</text>
  <text x="160" y="352" font-size="13" fill="#4c1d95" text-anchor="middle">only trees and tables changed</text>

  <rect x="400" y="250" width="250" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="525" y="276" font-size="15" font-weight="600" fill="#4c1d95" text-anchor="middle">per changed step:</text>
  <text x="525" y="298" font-size="13" fill="#4c1d95" text-anchor="middle">is there an input row where</text>
  <text x="525" y="316" font-size="13" fill="#4c1d95" text-anchor="middle">old(row) != new(row)?</text>
  <text x="525" y="340" font-size="13" fill="#4c1d95" text-anchor="middle">(10 s timeout per query)</text>

  <rect x="720" y="210" width="250" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="845" y="238" font-size="15" font-weight="600" fill="#14532d" text-anchor="middle">tier="smt"</text>
  <text x="845" y="260" font-size="13" fill="#14532d" text-anchor="middle">identical=True (no such row)</text>

  <rect x="720" y="300" width="250" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="845" y="326" font-size="15" font-weight="600" fill="#7f1d1d" text-anchor="middle">tier="smt"</text>
  <text x="845" y="348" font-size="13" fill="#7f1d1d" text-anchor="middle">identical=None,</text>
  <text x="845" y="368" font-size="13" fill="#7f1d1d" text-anchor="middle">evidence.counterexample = row</text>

  <rect x="30" y="395" width="620" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="340" y="420" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">tier="none", identical=None</text>
  <text x="340" y="442" font-size="13" fill="#1f2937" text-anchor="middle">evidence = the StructureDiff, reason = why z3 was not used (or could not encode a step)</text>

  <path d="M160,80 L160,116" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M290,165 L396,165" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="343" y="157" font-size="13" fill="#1f2937" text-anchor="middle">yes</text>
  <path d="M160,210 L160,246" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="178" y="234" font-size="13" fill="#1f2937">no</text>
  <path d="M290,305 L396,305" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="343" y="297" font-size="13" fill="#1f2937" text-anchor="middle">yes</text>
  <path d="M160,360 L160,391" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="178" y="382" font-size="13" fill="#1f2937">no</text>
  <path d="M650,280 L716,250" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M650,330 L716,338" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M525,360 L525,391" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="543" y="382" font-size="13" fill="#1f2937">unencodable</text>
</svg>
