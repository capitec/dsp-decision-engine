<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- VS Code window -->
  <rect x="20" y="20" width="390" height="600" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="40" y="46" font-size="15" font-weight="600" fill="#1f2937">VS Code window</text>

  <rect x="40" y="62" width="350" height="250" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="56" y="86" font-size="14" font-weight="600" fill="#4c1d95">extension host (Node): ui/vscode/src</text>
  <text x="56" y="112" font-size="13" fill="#4c1d95">extension.ts: views, commands, show()</text>
  <text x="56" y="136" font-size="13" fill="#4c1d95">python.ts: ask(cwd, cmd, args)</text>
  <text x="56" y="160" font-size="13" fill="#4c1d95">debugging.ts: debugFlow, watchDebugger</text>
  <text x="56" y="184" font-size="13" fill="#4c1d95">locate.ts: NODE_PATH, breakpoint mapping</text>
  <text x="56" y="208" font-size="13" fill="#4c1d95">outline.ts, yamlEdit.ts: flow-file tree, edits</text>
  <text x="56" y="232" font-size="13" fill="#4c1d95">datasets.ts: the Datasets view</text>
  <text x="56" y="256" font-size="13" fill="#4c1d95">graphPanel.ts: queues ToUI until "ready"</text>
  <text x="56" y="290" font-size="13" fill="#4c1d95">depends on ms-python.debugpy</text>

  <rect x="40" y="420" width="350" height="180" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="56" y="444" font-size="14" font-weight="600" fill="#4c1d95">webview: @decider/ui</text>
  <text x="56" y="470" font-size="13" fill="#4c1d95">webview/main.tsx renders &lt;App send listen can&gt;</text>
  <text x="56" y="494" font-size="13" fill="#4c1d95">can = {"reveal"}: stepping is debugpy's</text>
  <text x="56" y="518" font-size="13" fill="#4c1d95">ui/lib/src: Graph, Inspector, layout.ts</text>
  <text x="56" y="542" font-size="13" fill="#4c1d95">model/protocol.ts: ToUI, FromUI and</text>
  <text x="56" y="562" font-size="13" fill="#4c1d95">the generated bridge reply types</text>

  <line x1="200" y1="312" x2="200" y2="418" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="210" y="360" font-size="13" fill="#1f2937">postMessage</text>
  <text x="210" y="380" font-size="13" fill="#1f2937">ToUI / FromUI</text>

  <!-- process 1: one-shot bridge -->
  <rect x="520" y="20" width="460" height="170" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="536" y="46" font-size="14" font-weight="600" fill="#134e4a">one question: python -m decider._tooling.bridge --fd 3</text>
  <text x="536" y="72" font-size="13" fill="#134e4a">stdin: one request line, then EOF</text>
  <text x="536" y="96" font-size="13" fill="#134e4a">fd 3: one reply line (stdout ignored, stderr kept)</text>
  <text x="536" y="120" font-size="13" fill="#134e4a">describe · components · datasets</text>
  <text x="536" y="144" font-size="13" fill="#134e4a">dataset_schema · dataset_head</text>
  <text x="536" y="170" font-size="13" fill="#134e4a">a fresh process each time: edits always count</text>

  <!-- process 2: debugpy -->
  <rect x="520" y="220" width="460" height="170" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="536" y="246" font-size="14" font-weight="600" fill="#134e4a">Debug flow: debugpy launch of decider._tooling.bridge.run</text>
  <text x="536" y="272" font-size="13" fill="#134e4a">FILE [--pipeline] [--data | --dataset] [--row]</text>
  <text x="536" y="296" font-size="13" fill="#134e4a">runs the pipeline once, interpreted, in plain Python</text>
  <text x="536" y="320" font-size="13" fill="#134e4a">your breakpoints stop in your step functions</text>
  <text x="536" y="344" font-size="13" fill="#134e4a">at a pause the extension evaluates node_path()</text>
  <text x="536" y="368" font-size="13" fill="#134e4a">to light the node in the graph</text>

  <!-- process 3: long-lived -->
  <rect x="520" y="420" width="460" height="200" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="536" y="446" font-size="14" font-weight="600" fill="#134e4a">a long-lived bridge: Bridge.serve()</text>
  <text x="536" y="472" font-size="13" fill="#134e4a">reader thread: answers pause and cancel at once</text>
  <text x="536" y="496" font-size="13" fill="#134e4a">main thread: start, step, resume, set, state, ...</text>
  <text x="536" y="520" font-size="13" fill="#134e4a">over decider.debug.Session (interpreted)</text>
  <text x="536" y="544" font-size="13" fill="#134e4a">--debugpy PORT: also listen for an attach</text>
  <text x="536" y="574" font-size="13" fill="#1f2937">driven by tests and by any host that keeps one</text>
  <text x="536" y="596" font-size="13" fill="#1f2937">open; the VS Code panel no longer steps through it</text>

  <!-- arrows -->
  <path d="M390 136 L518 110" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="104" font-size="13" fill="#1f2937">spawn</text>
  <path d="M390 160 L518 290" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="422" y="310" font-size="13" fill="#1f2937">DAP via</text>
  <text x="422" y="328" font-size="13" fill="#1f2937">debugpy</text>
</svg>
