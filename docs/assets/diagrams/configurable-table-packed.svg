<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <!-- program -->
  <text x="20" y="24" font-size="15" font-weight="600" fill="#1f2937">program: consts[0] is its address, consts[1] = 1 is the entry row</text>
  <rect x="20" y="34" width="960" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="36" y="60" font-size="14" fill="#1e3a8a">row 0: BETWEEN, var float 0 (amount), condition 1, lo op GE, hi op LT, then MATCH, else FAIL</text>
  <text x="36" y="88" font-size="14" fill="#1e3a8a">row 1: EQ_S, var string 0 (product), condition 0, then row 0, else FAIL</text>

  <!-- header -->
  <text x="20" y="138" font-size="15" font-weight="600" fill="#1f2937">Rows.ints: header of two starts (ints, floats) per condition and output, then the data</text>
  <rect x="20" y="148" width="225" height="54" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="132" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">0: eq product</text>
  <text x="132" y="191" text-anchor="middle" font-size="13" fill="#1f2937">ints 8, floats 0</text>
  <rect x="265" y="148" width="225" height="54" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="377" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">1: between amount</text>
  <text x="377" y="191" text-anchor="middle" font-size="13" fill="#1f2937">ints 15, floats 0</text>
  <rect x="510" y="148" width="225" height="54" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="622" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">2: output rate</text>
  <text x="622" y="191" text-anchor="middle" font-size="13" fill="#1f2937">ints 21, floats 6</text>
  <rect x="755" y="148" width="225" height="54" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="867" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">3: output tier</text>
  <text x="867" y="191" text-anchor="middle" font-size="13" fill="#1f2937">ints 24, floats 0</text>

  <!-- ints data -->
  <rect x="20" y="214" width="225" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="132" y="236" text-anchor="middle" font-size="13" fill="#14532d">[8, 12) byte offsets 0, 4, 8, 12</text>
  <text x="132" y="258" text-anchor="middle" font-size="13" fill="#14532d">[12, 15) has value 1, 1, 1</text>
  <rect x="265" y="214" width="225" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="377" y="236" text-anchor="middle" font-size="13" fill="#14532d">[15, 18) has lower 0, 1, 1</text>
  <text x="377" y="258" text-anchor="middle" font-size="13" fill="#14532d">[18, 21) has upper 1, 0, 0</text>
  <rect x="510" y="214" width="225" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="622" y="236" text-anchor="middle" font-size="13" fill="#14532d">[21, 24) valid 1, 1, 1</text>
  <rect x="755" y="214" width="225" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="867" y="236" text-anchor="middle" font-size="13" fill="#14532d">[24, 27) valid 1, 1, 1</text>
  <text x="867" y="258" text-anchor="middle" font-size="13" fill="#14532d">[27, 30) codes 0, 1, 2</text>
  <text x="867" y="280" text-anchor="middle" font-size="13" fill="#14532d">(small, large, card)</text>

  <!-- floats -->
  <text x="20" y="326" font-size="15" font-weight="600" fill="#1f2937">Rows.floats</text>
  <rect x="265" y="336" width="225" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="377" y="360" text-anchor="middle" font-size="13" fill="#14532d">[0, 3) lower 0, 10000, 0</text>
  <text x="377" y="382" text-anchor="middle" font-size="13" fill="#14532d">[3, 6) upper 10000, 0, 0</text>
  <rect x="510" y="336" width="225" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="622" y="360" text-anchor="middle" font-size="13" fill="#14532d">[6, 9) rate</text>
  <text x="622" y="382" text-anchor="middle" font-size="13" fill="#14532d">0.2, 0.15, 0.22</text>

  <!-- chars -->
  <text x="20" y="432" font-size="15" font-weight="600" fill="#1f2937">Rows.chars</text>
  <rect x="20" y="442" width="72" height="50" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="56" y="472" text-anchor="middle" font-size="14" fill="#134e4a">loan</text>
  <rect x="98" y="442" width="72" height="50" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="134" y="472" text-anchor="middle" font-size="14" fill="#134e4a">loan</text>
  <rect x="176" y="442" width="69" height="50" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="210" y="472" text-anchor="middle" font-size="14" fill="#134e4a">card</text>
  <text x="265" y="462" font-size="13" fill="#1f2937">Rows = (ints address, floats address, chars address, n = 3)</text>
  <text x="265" y="484" font-size="13" fill="#1f2937">a band's open edge is "has lower 0" or "has upper 0"; its stored bound is 0.0 and unread</text>
</svg>
