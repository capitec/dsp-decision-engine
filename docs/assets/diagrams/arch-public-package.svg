<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <!-- user code -->
  <rect x="20" y="40" width="250" height="110" rx="9" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="145" y="70" font-size="15" font-weight="700" text-anchor="middle" fill="#7c2d00">user code</text>
  <text x="145" y="96" font-size="14" text-anchor="middle" fill="#7c2d00" font-family="ui-monospace, monospace">from decider.lab import checks</text>
  <text x="145" y="122" font-size="14" text-anchor="middle" fill="#7c2d00" font-family="ui-monospace, monospace">checks.run(pipeline)</text>

  <!-- public __init__ -->
  <rect x="330" y="30" width="340" height="130" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="58" font-size="15" font-weight="700" text-anchor="middle" fill="#4c1d95">lab/checks/__init__.py (public)</text>
  <text x="500" y="84" font-size="14" text-anchor="middle" fill="#4c1d95">__all__: Check, CheckContext, check,</text>
  <text x="500" y="106" font-size="14" text-anchor="middle" fill="#4c1d95">standard, Finding, Report, Severity,</text>
  <text x="500" y="128" font-size="14" text-anchor="middle" fill="#4c1d95">SkippedCheck, Suppression, run, catalogue</text>

  <!-- tests -->
  <rect x="730" y="40" width="250" height="110" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="855" y="70" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">tests/</text>
  <text x="855" y="96" font-size="14" text-anchor="middle" fill="#1f2937">may import private</text>
  <text x="855" y="118" font-size="14" text-anchor="middle" fill="#1f2937">modules directly</text>

  <!-- arrows top row -->
  <line x1="270" y1="95" x2="326" y2="95" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- private files -->
  <g font-size="14" text-anchor="middle" fill="#1f2937">
    <rect x="20" y="250" width="150" height="100" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="95" y="278" font-weight="700" fill="#4c1d95">_base.py</text>
    <text x="95" y="302" fill="#4c1d95">Check root,</text>
    <text x="95" y="322" fill="#4c1d95">CheckContext, @check</text>
    <rect x="182" y="250" width="150" height="100" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="257" y="278" font-weight="700" fill="#4c1d95">_report.py</text>
    <text x="257" y="302" fill="#4c1d95">Finding, Report,</text>
    <text x="257" y="322" fill="#4c1d95">text and SARIF</text>
    <rect x="344" y="250" width="150" height="100" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="419" y="278" font-weight="700" fill="#4c1d95">_run.py</text>
    <text x="419" y="302" fill="#4c1d95">run, catalogue</text>
    <rect x="506" y="250" width="150" height="100" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="581" y="278" font-weight="700" fill="#4c1d95">_config.py</text>
    <text x="581" y="302" fill="#4c1d95">checks.yaml</text>
    <text x="581" y="322" fill="#4c1d95">and checks.json</text>
    <rect x="668" y="250" width="150" height="100" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="743" y="278" font-weight="700" fill="#4c1d95">_ast.py</text>
    <text x="743" y="302" fill="#4c1d95">parse a step's</text>
    <text x="743" y="322" fill="#4c1d95">source</text>
    <rect x="830" y="250" width="150" height="100" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="905" y="278" font-weight="700" fill="#4c1d95">_builtin/</text>
    <text x="905" y="302" fill="#4c1d95">the catalogue,</text>
    <text x="905" y="322" fill="#4c1d95">loaded lazily</text>
  </g>

  <!-- re-export arrows -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M95,250 C95,205 420,200 440,164"/>
    <path d="M257,250 C257,215 470,205 490,164"/>
    <path d="M419,250 C419,220 530,210 545,164"/>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)">
    <path d="M880,150 L900,246"/>
  </g>
  <text x="500" y="392" font-size="14" text-anchor="middle" fill="#1f2937">Solid: what the public __init__.py re-exports. Dashed: a test reaching into a private file.</text>
  <text x="500" y="416" font-size="14" text-anchor="middle" fill="#6b7280">Code outside decider/lab/checks/ may import only the public names.</text>
</svg>
