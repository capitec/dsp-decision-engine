<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <!-- main process -->
  <rect x="15" y="15" width="560" height="530" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="35" y="42" font-size="15" font-weight="600" fill="#1f2937">your process</text>

  <rect x="35" y="58" width="250" height="62" rx="9" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="160" y="82" font-size="14" fill="#7c2d00" text-anchor="middle">caller thread</text>
  <text x="160" y="102" font-size="13" fill="#7c2d00" text-anchor="middle">run() blocks, or start()</text>

  <rect x="305" y="58" width="250" height="62" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="430" y="82" font-size="14" fill="#4c1d95" text-anchor="middle">RunHandle thread (daemon)</text>
  <text x="430" y="102" font-size="13" fill="#4c1d95" text-anchor="middle">JobHandle: status, cancel</text>
  <line x1="285" y1="89" x2="301" y2="89" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="35" y="140" width="520" height="70" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="295" y="164" font-size="14" fill="#134e4a" text-anchor="middle" font-weight="600">_run: validate, preflight, executors, _drive</text>
  <text x="295" y="186" font-size="13" fill="#134e4a" text-anchor="middle">one batch at a time from frame.slice(offset, batch_size)</text>
  <text x="295" y="203" font-size="13" fill="#134e4a" text-anchor="middle">baseline first, then each scenario</text>

  <rect x="35" y="230" width="250" height="110" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="160" y="254" font-size="14" fill="#134e4a" text-anchor="middle" font-weight="600">_Local (per scenario)</text>
  <text x="160" y="276" font-size="13" fill="#134e4a" text-anchor="middle">Engine().bind(step, mode=...)</text>
  <text x="160" y="296" font-size="13" fill="#134e4a" text-anchor="middle">fused, or stepped when nodes</text>
  <text x="160" y="314" font-size="13" fill="#134e4a" text-anchor="middle">are selected or an override</text>
  <text x="160" y="332" font-size="13" fill="#134e4a" text-anchor="middle">has at=</text>

  <rect x="305" y="230" width="250" height="110" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="430" y="254" font-size="14" fill="#134e4a" text-anchor="middle" font-weight="600">_Revision (per scenario)</text>
  <text x="430" y="276" font-size="13" fill="#134e4a" text-anchor="middle">first batch: spawn the worker</text>
  <text x="430" y="296" font-size="13" fill="#134e4a" text-anchor="middle">and wait for it to finish;</text>
  <text x="430" y="314" font-size="13" fill="#134e4a" text-anchor="middle">every batch: unpickle</text>
  <text x="430" y="332" font-size="13" fill="#134e4a" text-anchor="middle">revision-N/&lt;index&gt;.pkl</text>

  <rect x="35" y="360" width="520" height="80" rx="9" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="295" y="384" font-size="14" fill="#7c2d00" text-anchor="middle" font-weight="600">callbacks and metrics</text>
  <text x="295" y="406" font-size="13" fill="#7c2d00" text-anchor="middle">shared callbacks see every scenario; each metric is deep-copied</text>
  <text x="295" y="424" font-size="13" fill="#7c2d00" text-anchor="middle">per scenario and reset() before the run</text>

  <rect x="35" y="460" width="520" height="70" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="295" y="484" font-size="14" fill="#14532d" text-anchor="middle" font-weight="600">TemporaryDirectory decider-experiment-*</text>
  <text x="295" y="506" font-size="13" fill="#14532d" text-anchor="middle">input.parquet (written once, only for revision scenarios)</text>
  <text x="295" y="522" font-size="13" fill="#14532d" text-anchor="middle">revision-N/0.pkl, 1.pkl, ...</text>

  <line x1="295" y1="210" x2="160" y2="226" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="295" y1="210" x2="430" y2="226" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="160" y1="340" x2="160" y2="356" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="430" y1="340" x2="430" y2="356" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- worker -->
  <rect x="615" y="15" width="370" height="330" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="635" y="42" font-size="15" font-weight="600" fill="#1f2937">worker process, one per revision scenario</text>
  <text x="635" y="62" font-size="13" fill="#1f2937">python -m decider.lab.experiments._worker</text>

  <rect x="635" y="80" width="330" height="56" rx="9" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="800" y="103" font-size="14" fill="#7c2d00" text-anchor="middle">import_flow(entry, tree)</text>
  <text x="800" y="123" font-size="13" fill="#7c2d00" text-anchor="middle">params: the request's, or the old defaults</text>

  <rect x="635" y="152" width="330" height="56" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="800" y="175" font-size="14" fill="#134e4a" text-anchor="middle">_Local(step, params, scenario, selectors)</text>
  <text x="800" y="195" font-size="13" fill="#134e4a" text-anchor="middle">the same executor class as the parent</text>

  <rect x="635" y="224" width="330" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="800" y="247" font-size="14" fill="#14532d" text-anchor="middle">same batch boundaries over input.parquet</text>
  <text x="800" y="267" font-size="13" fill="#14532d" text-anchor="middle">pickle (output, node batches) per batch</text>

  <rect x="635" y="296" width="330" height="36" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="800" y="319" font-size="13" fill="#4c1d95" text-anchor="middle">one JSON line on stdout: ok or error</text>

  <line x1="800" y1="136" x2="800" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="800" y1="208" x2="800" y2="220" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="800" y1="280" x2="800" y2="292" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M555,270 L600,270 L600,108 L631,108" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="590" y="190" font-size="13" fill="#1f2937" text-anchor="end">JSON</text>
  <path d="M690,332 L690,495 L559,495" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="682" y="420" font-size="13" fill="#1f2937" text-anchor="end">pickles</text>

  <!-- git -->
  <rect x="725" y="365" width="260" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="855" y="390" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="600">git worktree</text>
  <text x="855" y="410" font-size="13" fill="#4c1d95" text-anchor="middle">decider-revision-*</text>
  <text x="855" y="430" font-size="13" fill="#4c1d95" text-anchor="middle">one per resolved SHA, shared</text>
  <text x="855" y="448" font-size="13" fill="#4c1d95" text-anchor="middle">by its scenarios; removed</text>
  <text x="855" y="466" font-size="13" fill="#4c1d95" text-anchor="middle">in a finally block</text>
</svg>
