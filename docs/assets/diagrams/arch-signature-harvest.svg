<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="system-ui, sans-serif">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <!-- code panel -->
  <rect x="20" y="20" width="520" height="330" rx="10" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <g font-family="ui-monospace, monospace" font-size="14" fill="#7c2d00">
    <text x="36" y="56">@step(output="limit")</text>
    <text x="36" y="100">def cap_limit(limit: float,</text>
    <text x="36" y="144">              sector: str | None,</text>
    <text x="36" y="188">              bureau_score: float = missing_as(0.0),</text>
    <text x="36" y="232">              cap: float = param(20000.0, ge=0),</text>
    <text x="36" y="276">              rate: float = param(0.1, shared_key="rate"),</text>
    <text x="36" y="320">              ) -&gt; float:</text>
  </g>

  <!-- declaration boxes -->
  <g font-size="14">
    <rect x="600" y="80" width="380" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="614" y="101" fill="#1e3a8a">Input("limit", float, REQUIRED)</text>
    <rect x="600" y="124" width="380" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="614" y="145" fill="#1e3a8a">Input("sector", str | None, OPTIONAL)</text>
    <rect x="600" y="168" width="380" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="614" y="189" fill="#1e3a8a">Input("bureau_score", float, MISSING_AS, 0.0)</text>
    <rect x="600" y="212" width="380" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="614" y="233" fill="#14532d">ParamDecl("cap", float, 20000.0) + Field(ge=0)</text>
    <rect x="600" y="256" width="380" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="614" y="277" fill="#14532d">ParamDecl("rate", float, 0.1, shared_key="rate")</text>
    <rect x="600" y="300" width="380" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="614" y="321" fill="#1e3a8a">Output("limit", float)</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" marker-end="url(#h)" fill="none">
    <line x1="264" y1="96" x2="596" y2="96"/>
    <line x1="340" y1="140" x2="596" y2="140"/>
    <line x1="520" y1="184" x2="596" y2="184"/>
    <line x1="520" y1="228" x2="596" y2="228"/>
    <line x1="536" y1="272" x2="596" y2="272"/>
    <line x1="252" y1="316" x2="596" y2="316"/>
    <path d="M210,52 C560,52 560,300 596,312" stroke-dasharray="4 3"/>
  </g>

  <!-- bottom: the node -->
  <rect x="20" y="380" width="960" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="36" y="408" font-size="14" fill="#134e4a" font-family="ui-monospace, monospace">CallNode(Origin("loan/cap_limit", "credit.rules:cap_limit"), "scalar", cap_limit,</text>
  <text x="36" y="432" font-size="14" fill="#134e4a" font-family="ui-monospace, monospace">         inputs=(limit, sector, bureau_score), outputs=(limit,), params=(cap, rate))</text>
  <line x1="500" y1="350" x2="500" y2="376" stroke="#4b5563" stroke-width="1.5" marker-end="url(#h)"/>
</svg>
