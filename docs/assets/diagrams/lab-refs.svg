<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7">
      <circle cx="5" cy="5" r="4" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <!-- control tree -->
  <polyline points="70,74 70,262" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="70" y1="122" x2="100" y2="122" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="70" y1="192" x2="100" y2="192" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="70" y1="262" x2="100" y2="262" stroke="#2563eb" stroke-width="1.5"/>
  <polyline points="130,284 130,332 160,332" fill="none" stroke="#2563eb" stroke-width="1.5"/>

  <rect x="40" y="30" width="230" height="44" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="155" y="57" text-anchor="middle" font-size="15" fill="#1e3a8a">loan  (sequence)</text>
  <rect x="100" y="100" width="260" height="44" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="127" text-anchor="middle" font-size="15" fill="#1e3a8a">loan/affordability  (call)</text>
  <rect x="100" y="170" width="260" height="44" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="197" text-anchor="middle" font-size="15" fill="#1e3a8a">loan/approved  (call)</text>
  <rect x="100" y="240" width="260" height="44" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="267" text-anchor="middle" font-size="15" fill="#1e3a8a">loan/offer_by_approval  (branch)</text>
  <rect x="160" y="310" width="260" height="44" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290" y="337" text-anchor="middle" font-size="14" fill="#1e3a8a">is_approved · full_offer · no_offer</text>
  <text x="40" y="300" font-size="13" fill="#1e3a8a">control</text>

  <!-- data edge -->
  <path d="M360,132 C410,132 410,182 362,182" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
  <text x="414" y="152" font-size="13" fill="#14532d">data</text>

  <!-- dataset row -->
  <rect x="40" y="390" width="380" height="44" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="417" text-anchor="middle" font-size="14" fill="#14532d">loans.parquet  row where client_id = C-1182</text>

  <!-- ref cards -->
  <g font-size="13" fill="#1f2937">
    <rect x="540" y="26" width="420" height="52" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="556" y="47" font-size="15" font-weight="600">FlowRef</text>
    <text x="556" y="68">flow_id='0123abcdef45' · name='loan'</text>

    <rect x="540" y="96" width="420" height="52" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="556" y="117" font-size="15" font-weight="600">ValueSlotRef</text>
    <text x="556" y="138">spec 'affordability@loan/affordability'</text>

    <rect x="540" y="166" width="420" height="52" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="556" y="187" font-size="15" font-weight="600">EdgeRef</text>
    <text x="556" y="208">kind='data' · values=('affordability',)</text>

    <rect x="540" y="236" width="420" height="52" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="556" y="257" font-size="15" font-weight="600">StepRef</text>
    <text x="556" y="278">(flow_id, step_id) durable · path='loan/approved' derived</text>

    <rect x="540" y="386" width="420" height="52" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="556" y="407" font-size="15" font-weight="600">RecordRef</text>
    <text x="556" y="428">dataset='loans.parquet' · key={'client_id': 'C-1182'}</text>
  </g>

  <!-- leaders -->
  <line x1="538" y1="52" x2="272" y2="52" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="538" y1="118" x2="362" y2="112" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="538" y1="192" x2="410" y2="160" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="538" y1="262" x2="362" y2="204" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="538" y1="412" x2="422" y2="412" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
