<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="system-ui, sans-serif">
  <defs>
    <marker id="fg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#1f2937">Sequence "loan", fused mode: which calls share a kernel</text>

  <!-- Kernel 1 -->
  <rect x="15" y="44" width="235" height="400" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="30" y="68" font-size="15" font-weight="600" fill="#134e4a">Kernel 1</text>
  <rect x="30" y="84" width="205" height="36" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="132" y="107" font-size="14" text-anchor="middle" fill="#7c2d00">disposable_income</text>
  <rect x="30" y="140" width="205" height="36" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="132" y="163" font-size="14" text-anchor="middle" fill="#7c2d00">affordability</text>
  <rect x="30" y="196" width="205" height="36" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="132" y="219" font-size="14" text-anchor="middle" fill="#7c2d00">approved</text>
  <line x1="132" y1="120" x2="132" y2="138" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
  <line x1="132" y1="176" x2="132" y2="194" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
  <text x="30" y="266" font-size="13" fill="#134e4a">reads: net_income, expenses,</text>
  <text x="30" y="284" font-size="13" fill="#134e4a">instalment</text>
  <text x="30" y="310" font-size="13" fill="#134e4a">keeps: disposable_income</text>
  <text x="30" y="328" font-size="13" fill="#134e4a">(the branch reads it), approved</text>
  <text x="30" y="346" font-size="13" fill="#134e4a">(a pipeline output)</text>
  <text x="30" y="372" font-size="13" fill="#134e4a">never stored: affordability</text>
  <text x="30" y="390" font-size="13" fill="#134e4a">(read only inside this kernel)</text>

  <!-- Frame step -->
  <rect x="265" y="44" width="215" height="400" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="280" y="68" font-size="15" font-weight="600" fill="#1f2937">No unit</text>
  <rect x="280" y="84" width="185" height="36" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="372" y="107" font-size="14" text-anchor="middle" fill="#1f2937">join_bureau</text>
  <text x="280" y="160" font-size="13" fill="#1f2937">A frame step runs in</text>
  <text x="280" y="178" font-size="13" fill="#1f2937">Python on the whole frame.</text>
  <text x="280" y="204" font-size="13" fill="#1f2937">It ends the run of scalar</text>
  <text x="280" y="222" font-size="13" fill="#1f2937">calls, so the calls after</text>
  <text x="280" y="240" font-size="13" fill="#1f2937">it start a new kernel.</text>

  <!-- Kernel 2 -->
  <rect x="495" y="44" width="215" height="400" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="510" y="68" font-size="15" font-weight="600" fill="#134e4a">Kernel 2</text>
  <rect x="510" y="84" width="185" height="36" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="602" y="107" font-size="14" text-anchor="middle" fill="#7c2d00">risk_band</text>
  <rect x="510" y="140" width="185" height="36" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="602" y="163" font-size="14" text-anchor="middle" fill="#7c2d00">prime</text>
  <line x1="602" y1="120" x2="602" y2="138" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
  <text x="510" y="266" font-size="13" fill="#134e4a">reads: bureau_score</text>
  <text x="510" y="292" font-size="13" fill="#134e4a">keeps: risk_band (read by</text>
  <text x="510" y="310" font-size="13" fill="#134e4a">the branch), prime (output)</text>

  <!-- Packed branch -->
  <rect x="725" y="44" width="260" height="400" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="68" font-size="15" font-weight="600" fill="#134e4a">Packed kernel: by_band</text>
  <rect x="740" y="84" width="230" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="855" y="107" font-size="14" text-anchor="middle" fill="#1e3a8a">condition: prime</text>
  <rect x="740" y="150" width="108" height="36" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="794" y="173" font-size="13" text-anchor="middle" fill="#7c2d00">full_limit</text>
  <rect x="862" y="150" width="108" height="36" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="916" y="173" font-size="13" text-anchor="middle" fill="#7c2d00">half_limit</text>
  <line x1="820" y1="120" x2="800" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
  <line x1="890" y1="120" x2="910" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
  <text x="792" y="138" font-size="12" fill="#1f2937">true</text>
  <text x="904" y="138" font-size="12" fill="#1f2937">false</text>
  <rect x="790" y="210" width="130" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="855" y="232" font-size="13" text-anchor="middle" fill="#1e3a8a">merge: limit</text>
  <line x1="794" y1="186" x2="830" y2="208" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
  <line x1="916" y1="186" x2="880" y2="208" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
  <text x="740" y="292" font-size="13" fill="#134e4a">One Fork per row inside the</text>
  <text x="740" y="310" font-size="13" fill="#134e4a">kernel. Keeps only limit.</text>
  <text x="740" y="336" font-size="13" fill="#134e4a">Stepped mode, or a failed</text>
  <text x="740" y="354" font-size="13" fill="#134e4a">packing rule: the condition and</text>
  <text x="740" y="372" font-size="13" fill="#134e4a">each arm are kernels of their</text>
  <text x="740" y="390" font-size="13" fill="#134e4a">own, driven from Python.</text>

  <!-- order arrows -->
  <line x1="250" y1="102" x2="263" y2="102" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
  <line x1="480" y1="102" x2="493" y2="102" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
  <line x1="710" y1="102" x2="723" y2="102" stroke="#374151" stroke-width="1.5" marker-end="url(#fg-arrow)"/>
</svg>
