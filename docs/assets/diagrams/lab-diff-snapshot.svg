<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <!-- column titles -->
  <text x="130" y="30" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">to_ir(step), pre-order</text>
  <text x="520" y="30" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">parts per node (sha256 each)</text>
  <text x="870" y="30" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Snapshot</text>

  <!-- IR nodes -->
  <rect x="20" y="50" width="220" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="74" font-size="14" fill="#1e3a8a" text-anchor="middle">SequenceNode</text>
  <text x="130" y="94" font-size="13" fill="#1e3a8a" text-anchor="middle">credit (2 children)</text>

  <rect x="40" y="150" width="200" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="174" font-size="14" fill="#1e3a8a" text-anchor="middle">CallNode</text>
  <text x="140" y="194" font-size="13" fill="#1e3a8a" text-anchor="middle">credit/ratio</text>

  <rect x="40" y="290" width="200" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="314" font-size="14" fill="#1e3a8a" text-anchor="middle">CallNode</text>
  <text x="140" y="334" font-size="13" fill="#1e3a8a" text-anchor="middle">credit/approved</text>

  <!-- parts: sequence -->
  <rect x="300" y="50" width="440" height="56" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="318" y="74" font-size="14" fill="#1f2937" font-weight="600">other</text>
  <text x="318" y="94" font-size="13" fill="#1f2937">the node's own dataclass fields, minus origin and child nodes</text>
  <line x1="240" y1="78" x2="296" y2="78" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- parts: call -->
  <rect x="300" y="130" width="440" height="230" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="318" y="156" font-size="14" fill="#134e4a" font-weight="600">code</text>
  <text x="380" y="156" font-size="13" fill="#134e4a">kind, nogil, fingerprint(fn, strict=True)</text>
  <text x="380" y="174" font-size="13" fill="#134e4a">(+ the reference twin unless it carries arrays)</text>
  <text x="318" y="204" font-size="14" fill="#134e4a" font-weight="600">consts</text>
  <text x="380" y="204" font-size="13" fill="#134e4a">literal values; packed array addresses</text>
  <text x="380" y="222" font-size="13" fill="#134e4a">replaced by the arrays' content</text>
  <text x="318" y="252" font-size="14" fill="#134e4a" font-weight="600">inputs</text>
  <text x="380" y="252" font-size="13" fill="#134e4a">the value names the call reads</text>
  <text x="318" y="280" font-size="14" fill="#134e4a" font-weight="600">outputs</text>
  <text x="380" y="280" font-size="13" fill="#134e4a">the value names it writes</text>
  <text x="318" y="308" font-size="14" fill="#134e4a" font-weight="600">params</text>
  <text x="380" y="308" font-size="13" fill="#134e4a">ParamDecls: name, annotation, default,</text>
  <text x="380" y="326" font-size="13" fill="#134e4a">bounds, shared_key, on_invalid</text>
  <line x1="240" y1="178" x2="296" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="240" y1="318" x2="296" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- whole hash -->
  <rect x="790" y="50" width="190" height="300" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="885" y="80" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">hash</text>
  <text x="885" y="102" font-size="13" fill="#1e3a8a" text-anchor="middle">sha256 over, per node:</text>
  <text x="885" y="124" font-size="13" fill="#1e3a8a" text-anchor="middle">"Type/child count"</text>
  <text x="885" y="144" font-size="13" fill="#1e3a8a" text-anchor="middle">+ each part digest</text>
  <text x="885" y="186" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">parts</text>
  <text x="885" y="206" font-size="13" fill="#1e3a8a" text-anchor="middle">one dict per node</text>
  <text x="885" y="246" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">decls</text>
  <text x="885" y="266" font-size="13" fill="#1e3a8a" text-anchor="middle">(display, digest) per</text>
  <text x="885" y="284" font-size="13" fill="#1e3a8a" text-anchor="middle">param field</text>
  <text x="885" y="322" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="600">description</text>
  <text x="885" y="340" font-size="13" fill="#1e3a8a" text-anchor="middle">describe(step)</text>
  <line x1="740" y1="200" x2="786" y2="200" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="740" y1="78" x2="786" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- not hashed -->
  <rect x="20" y="400" width="460" height="100" rx="9" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="38" y="426" font-size="14" fill="#7c2d00" font-weight="600">Left out of the hash</text>
  <text x="38" y="450" font-size="13" fill="#7c2d00">origin: path, name, source, durable id</text>
  <text x="38" y="470" font-size="13" fill="#7c2d00">the function's own name, file and line numbers</text>
  <text x="38" y="490" font-size="13" fill="#7c2d00">so a rename or a move keeps identical=True</text>

  <rect x="520" y="400" width="460" height="100" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="538" y="426" font-size="14" fill="#7f1d1d" font-weight="600">Hashed to a fresh random token</text>
  <text x="538" y="450" font-size="13" fill="#7f1d1d">an object with no content hash (keyed by identity),</text>
  <text x="538" y="470" font-size="13" fill="#7f1d1d">a function fingerprint cannot key strictly,</text>
  <text x="538" y="490" font-size="13" fill="#7f1d1d">so two such snapshots never compare equal</text>
</svg>
