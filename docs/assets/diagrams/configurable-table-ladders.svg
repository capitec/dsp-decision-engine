<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="330" fill="#ffffff"/>

  <!-- axis -->
  <line x1="150" y1="282" x2="960" y2="282" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="960" y="306" text-anchor="end" font-size="13" fill="#1f2937">score</text>
  <line x1="380" y1="276" x2="380" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="380" y="306" text-anchor="middle" font-size="13" fill="#1f2937">600</text>
  <line x1="510" y1="276" x2="510" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="510" y="306" text-anchor="middle" font-size="13" fill="#1f2937">650</text>
  <line x1="640" y1="276" x2="640" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="640" y="306" text-anchor="middle" font-size="13" fill="#1f2937">700</text>
  <line x1="380" y1="40" x2="380" y2="276" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="510" y1="40" x2="510" y2="276" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="640" y1="40" x2="640" y2="276" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ladder A -->
  <text x="20" y="62" font-size="14" font-weight="600" fill="#1f2937">grade A</text>
  <text x="20" y="82" font-size="13" fill="#1f2937">rows 0, 2, 4</text>
  <rect x="150" y="44" width="228" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="264" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">row 0: multiple 2.0</text>
  <text x="264" y="84" text-anchor="middle" font-size="13" fill="#14532d">lo None (open), hi 600</text>
  <rect x="382" y="44" width="256" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="510" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">row 2: multiple 3.0</text>
  <text x="510" y="84" text-anchor="middle" font-size="13" fill="#14532d">lo None, filled: 600 from row 0</text>
  <rect x="642" y="44" width="300" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="792" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">row 4: multiple 4.0</text>
  <text x="792" y="84" text-anchor="middle" font-size="13" fill="#14532d">lo 700, hi None (open)</text>

  <!-- ladder B -->
  <text x="20" y="150" font-size="14" font-weight="600" fill="#1f2937">grade B</text>
  <text x="20" y="170" font-size="13" fill="#1f2937">rows 1, 3</text>
  <rect x="150" y="132" width="358" height="48" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="329" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d00">row 1: multiple 1.0</text>
  <text x="329" y="172" text-anchor="middle" font-size="13" fill="#7c2d00">lo None (open), hi 650</text>
  <rect x="512" y="132" width="430" height="48" rx="8" fill="#fff1e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="727" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d00">row 3: multiple 1.5</text>
  <text x="727" y="172" text-anchor="middle" font-size="13" fill="#7c2d00">lo 650, hi None (open)</text>

  <!-- rejected -->
  <text x="20" y="226" font-size="14" font-weight="600" fill="#7f1d1d">rejected</text>
  <rect x="642" y="208" width="300" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="792" y="230" text-anchor="middle" font-size="13" fill="#7f1d1d">row 4 with lo 720: "Row 2 upper (700.0)</text>
  <text x="792" y="248" text-anchor="middle" font-size="13" fill="#7f1d1d">!= row 4 lower (720.0)" unless allow_gaps</text>
</svg>
