[project]
name = "decider-bridge"
version = "0.0.1"
description = "The Python side of decider's flow debuggers (VS Code, JupyterLab)"
requires-python = ">=3.10"
dependencies = ["decider", "polars"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decider_bridge"]

[tool.uv.sources]
decider = { path = "../..", editable = true }
