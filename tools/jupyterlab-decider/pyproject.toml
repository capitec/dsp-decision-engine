[project]
name = "jupyterlab-decider"
version = "0.0.1"
description = "Visualise, run and step through decider pipelines in JupyterLab"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["decider", "decider-bridge", "ipykernel", "comm"]

[dependency-groups]
dev = ["jupyterlab>=4,<5", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decider_jupyter"]

# The prebuilt frontend: `pnpm build` writes it into decider_jupyter/labextension first.
[tool.hatch.build.targets.wheel.shared-data]
"decider_jupyter/labextension" = "share/jupyter/labextensions/jupyterlab-decider"

[tool.uv.sources]
decider = { path = "../..", editable = true }
decider-bridge = { path = "../decider-bridge", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
